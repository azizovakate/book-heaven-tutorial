<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Книжковий Рай — робимо сайт самі</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Roboto:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --green:#556b2f; --green2:#8fbc8f; --deep:#2f4f4f; --paper:#fbfaf5; --ink:#24301c; --muted:#5f6b58;
  --line:#e1e4d6; --card:#fff; --html:#d9653b; --css:#2f7fb5; --warn:#fff3d6; --warnb:#e8b64a;
  --note:#eef5e6; --noteb:#8fbc8f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Roboto',system-ui,sans-serif;color:var(--ink);background:var(--paper);font-size:17px;line-height:1.6}
a{color:var(--green)}
code,kbd,pre{font-family:'JetBrains Mono',ui-monospace,monospace}
code{background:#eef0e6;border-radius:5px;padding:1px 6px;font-size:.86em;color:#3c4a2a;white-space:nowrap}
kbd{background:#fff;border:1px solid #cfd3c3;border-bottom-width:3px;border-radius:6px;padding:0 6px;font-size:.82em}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:12px 22px;background:var(--green);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.brand{display:flex;align-items:center;gap:10px;font-family:'Lora',serif;font-weight:700;font-size:20px;white-space:nowrap}
.brand img{width:30px}
.prog{flex:1;display:flex;align-items:center;gap:12px;min-width:120px}
.bar{flex:1;height:10px;background:rgba(255,255,255,.22);border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--green2);border-radius:10px;transition:width .4s}
.prog span{font-size:14px;white-space:nowrap;opacity:.95}
.menu-btn{display:none;background:none;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;padding:4px 10px;font-size:15px;cursor:pointer}

/* ---------- layout ---------- */
.wrap{display:grid;grid-template-columns:280px 1fr;min-height:calc(100% - 58px)}
nav{border-right:1px solid var(--line);padding:18px 12px 40px;background:#f4f3ea;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto}
nav h4{margin:18px 10px 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
nav h4:first-child{margin-top:0}
nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:9px;font:inherit;font-size:15px;color:var(--ink);cursor:pointer;line-height:1.3}
nav button:hover{background:#e9e9dc}
nav button.on{background:var(--green);color:#fff}
nav .dot{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:#fff;border:2px solid #cdd3bf;color:var(--muted)}
nav button.done .dot{background:var(--green2);border-color:var(--green2);color:#fff}
nav button.on .dot{border-color:#fff}
main.content{padding:34px 48px 80px;max-width:980px;width:100%}

/* ---------- step ---------- */
.chip{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:20px;background:#e5ead9;color:var(--green)}
.chip.HTML{background:#fbe5dc;color:var(--html)} .chip.CSS{background:#dcebf6;color:var(--css)}
.stepno{color:var(--muted);font-size:14px;margin-left:8px}
h1.st{font-family:'Lora',serif;font-size:38px;line-height:1.15;margin:10px 0 18px;color:var(--green)}
h3{font-family:'Lora',serif;font-size:22px;color:var(--deep);margin:28px 0 8px}
.lead{font-size:20px}
.note,.warn{border-radius:12px;padding:12px 16px;margin:14px 0}
.note{background:var(--note);border-left:5px solid var(--noteb)}
.warn{background:var(--warn);border-left:5px solid var(--warnb)}
ul.nice,ol.nice{padding-left:22px} ul.nice li,ol.nice li{margin:6px 0}
pre.tree{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 18px;font-size:15px;line-height:1.7;overflow:auto}
pre.mini{background:#1f2a1c;color:#e9eedf;border-radius:10px;padding:12px 16px;font-size:15px;overflow:auto}
pre.mini .t{color:#ff9b73} pre.mini .s{color:#ffd479} pre.mini .p{color:#8fd1ff} pre.mini .v{color:#b5e08a} pre.mini .c{color:#8c9a84}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.duo-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.duo-card b{font-size:22px} .duo-ico{font-size:30px} .duo-card code{align-self:flex-start}
.html-c{border-top:5px solid var(--html)} .css-c{border-top:5px solid var(--css)}
.bands div{padding:12px 16px;font-weight:500;font-size:15px;border:1px solid var(--line);border-bottom:0}
.bands{border-bottom:1px solid var(--line);border-radius:12px;overflow:hidden;margin:12px 0}
.cardmap{display:flex;align-items:center;gap:18px;margin:14px 0;flex-wrap:wrap}
.cm-card{background:#fff;border:2px dashed var(--green2);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:'JetBrains Mono',monospace;font-size:12px;width:150px}
.cm-img{width:80px;height:110px;background:#2f5d8a;color:#fff;display:grid;place-items:center;border-radius:4px}
.cm-t{color:var(--green);font-weight:700} .cm-a{color:#666} .cm-p{color:var(--green2);font-weight:700}
.cm-arrow{color:var(--muted);font-size:15px}

/* task card */
.task{background:#fff;border:2px solid var(--green);border-radius:16px;padding:16px 20px 12px;margin:26px 0 14px;position:relative}
.task h5{margin:0 0 6px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--green)}
.task ol{margin:0;padding-left:22px} .task li{margin:5px 0}
.tip-type{font-size:14px;color:var(--muted);margin:8px 0 0}
.reveal{display:inline-flex;align-items:center;gap:8px;margin:6px 0 4px;background:var(--deep);color:#fff;border:0;border-radius:24px;padding:11px 22px;font:inherit;font-weight:700;cursor:pointer}
.reveal:hover{filter:brightness(1.15)}

/* code */
.codebox{margin:14px 0 18px;border-radius:14px;overflow:hidden;background:#1f2a1c;box-shadow:0 4px 18px rgba(0,0,0,.08)}
.codehead{display:flex;align-items:center;gap:10px;padding:9px 12px 9px 16px;background:#2a3826;color:#dfe6d4;font-size:14px;flex-wrap:wrap}
.fname{font-family:'JetBrains Mono',monospace;font-weight:600;padding:2px 9px;border-radius:6px;font-size:13px}
.fname.html{background:var(--html);color:#fff} .fname.css{background:var(--css);color:#fff}
.where{flex:1;min-width:150px;opacity:.9}
.cbtn{background:#3f5139;color:#fff;border:0;border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.cbtn:hover{background:#4e6446}
pre.code{margin:0;padding:16px 18px;color:#e9eedf;font-size:14.5px;line-height:1.6;overflow:auto;max-height:520px;tab-size:4}
.hl-tag{color:#ff9b73} .hl-attr{color:#ffd479} .hl-str{color:#b5e08a} .hl-com{color:#8c9a84;font-style:italic}
.hl-sel{color:#ffd479} .hl-prop{color:#8fd1ff} .hl-val{color:#b5e08a} .hl-punc{color:#c9d2bd}
.fullfile{margin:-6px 0 18px}
.fullfile summary{cursor:pointer;color:var(--muted);font-size:15px}

/* preview */
.pv{margin:26px 0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.pvhead{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#efefe6;border-bottom:1px solid var(--line);font-size:14px;color:var(--muted)}
.dots{display:flex;gap:6px}.dots i{width:11px;height:11px;border-radius:50%;background:#e06c5a;display:block}.dots i:nth-child(2){background:#e6b64a}.dots i:nth-child(3){background:#78b45c}
.pvurl{flex:1;background:#fff;border-radius:7px;padding:3px 10px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pvframe{position:relative;height:540px;overflow:hidden}
.pvframe iframe{border:0;transform-origin:0 0;position:absolute;left:0;top:0;background:#fff}
.pvcap{padding:8px 14px;font-size:14px;color:var(--muted);border-top:1px solid var(--line);background:#fafaf4}

/* words */
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:10px 0}
.word{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14.5px;line-height:1.4}
.word b{display:block;font-family:'JetBrains Mono',monospace;color:var(--deep);font-size:14px;margin-bottom:3px}

/* quiz */
.quiz{background:#f1f6fb;border:1px solid #cfe1ef;border-radius:16px;padding:16px 20px;margin:26px 0}
.quiz h5{margin:0 0 4px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--css)}
.quiz p.q{font-weight:500;margin:4px 0 10px}
.qopt{display:block;width:100%;text-align:left;margin:7px 0;padding:10px 14px;border-radius:10px;border:2px solid #cfe1ef;background:#fff;font:inherit;cursor:pointer}
.qopt:hover{border-color:var(--css)}
.qopt.right{border-color:#5aa04a;background:#eaf6e4}
.qopt.wrong{border-color:#d9653b;background:#fdece6}
.qres{margin-top:8px;font-weight:500}

/* nav buttons */
.stepnav{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:22px;border-top:1px solid var(--line)}
.btn{border:0;border-radius:28px;padding:13px 26px;font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:#ecece1;color:var(--ink)}
.btn.go{background:var(--green);color:#fff}
.btn.go:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.4;cursor:default}

/* widgets */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin:12px 0}
.gallery figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.gallery img{max-width:100%;height:130px;object-fit:contain;display:block;margin:0 auto 6px}
.gallery .logo-bg{background:var(--green);border-radius:8px}
.gallery figcaption{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600}
.swatches{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.sw{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:30px;padding:5px 14px 5px 5px;font-size:14px}
.sw i{width:28px;height:28px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.12)}
.sw code{background:none;padding:0}

.flexlab{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
.flexctl{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:12px}
.flexctl div{display:flex;flex-direction:column;gap:5px;font-size:13px;font-family:'JetBrains Mono',monospace;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid #cdd3bf;background:#f6f6ee;border-radius:7px;padding:4px 9px;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--green);color:#fff;border-color:var(--green)}
.flexbox{display:flex;min-height:230px;background:#556b2f;border-radius:12px;padding:14px;gap:10px;transition:all .3s}
.flexbox span{background:#fff;border-radius:8px;padding:10px 14px;font-weight:700;color:var(--green)}
.flexbox span:nth-child(2){padding:16px 26px;font-family:'Lora',serif;font-size:20px}
.flexcode{margin-top:10px;font-family:'JetBrains Mono',monospace;font-size:13.5px;background:#1f2a1c;color:#e9eedf;border-radius:10px;padding:10px 14px;white-space:pre}

.boxmodel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin:14px 0;display:flex;justify-content:center}
.bm-margin{background:repeating-linear-gradient(45deg,#fbe9d5,#fbe9d5 8px,#f7dcc0 8px,#f7dcc0 16px);padding:26px;border-radius:10px;position:relative;text-align:center}
.bm-border{border:5px solid var(--green);border-radius:10px}
.bm-padding{background:#e3efd8;padding:26px;position:relative}
.bm-content{background:#fff;border:1px dashed #9aa58b;padding:14px 24px;font-weight:700}
.bm-l{position:absolute;top:4px;left:10px;font-size:12px;font-family:'JetBrains Mono',monospace;font-weight:600}

.checks label{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:7px 0;cursor:pointer}
.checks input{width:19px;height:19px;margin-top:3px;accent-color:var(--green)}
.bugs details{background:#fff;border:1px solid var(--line);border-radius:10px;margin:8px 0;padding:10px 14px}
.bugs summary{cursor:pointer;font-weight:500}
.bugs p{margin:8px 0 2px}

.gh{counter-reset:g}
.gh-step{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px 14px 62px;margin:12px 0;position:relative}
.gh-step::before{counter-increment:g;content:counter(g);position:absolute;left:16px;top:14px;width:32px;height:32px;border-radius:50%;background:#24292f;color:#fff;display:grid;place-items:center;font-weight:700}
.gh-step h4{margin:2px 0 6px;font-size:18px}
.gh-step p{margin:6px 0}
.ghb{display:inline-block;font-family:-apple-system,'Segoe UI',sans-serif;font-size:13px;font-weight:600;padding:3px 11px;border-radius:6px;border:1px solid rgba(31,35,40,.15);background:#f6f8fa;color:#24292f;white-space:nowrap}
.ghb.green{background:#1f883d;color:#fff;border-color:rgba(31,35,40,.15)}
.urlbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#eef5e6;border:2px solid var(--green2);border-radius:12px;padding:10px 14px;margin:8px 0;font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:600}
.urlbox span{flex:1;word-break:break-all}
.msg{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 18px;white-space:pre-wrap;font-size:16px}

/* fullscreen preview */
.overlay{position:fixed;inset:0;background:rgba(20,28,18,.75);z-index:50;display:none;padding:24px}
.overlay.on{display:flex;flex-direction:column}
.overlay .ovbar{display:flex;justify-content:flex-end;margin-bottom:10px}
.overlay iframe{flex:1;border:0;border-radius:12px;background:#fff;width:100%}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--deep);color:#fff;padding:10px 20px;border-radius:24px;font-size:15px;transition:transform .3s;z-index:60}
.toast.on{transform:translateX(-50%) translateY(0)}

@media (max-width:860px){
  .wrap{grid-template-columns:1fr}
  nav{position:fixed;top:58px;left:0;width:290px;z-index:30;transform:translateX(-100%);transition:transform .25s;box-shadow:4px 0 20px rgba(0,0,0,.15)}
  nav.open{transform:none}
  .menu-btn{display:block}
  main.content{padding:24px 18px 70px}
  h1.st{font-size:30px}
  .duo{grid-template-columns:1fr}
  .prog span{display:none}
  .brand span{display:none}
}
</style>
</head>
<body>
<header class="top">
  <button class="menu-btn" id="menuBtn" aria-label="Меню">☰ Кроки</button>
  <div class="brand"><img src="img/logo.png" alt=""><span>Книжковий Рай · майстерня</span></div>
  <div class="prog"><div class="bar"><i id="barFill"></i></div><span id="progTxt"></span></div>
</header>
<div class="wrap">
  <nav id="nav"></nav>
  <main class="content" id="content"></main>
</div>
<div class="overlay" id="overlay"><div class="ovbar"><button class="btn ghost" id="ovClose">✕ Закрити</button></div><iframe id="ovFrame" sandbox title="Сайт на весь екран"></iframe></div>
<div class="toast" id="toast"></div>

<script>
const STEPS = [{"id": "start", "part": "Старт", "title": "Що ми будуємо", "html": 5, "css": 5, "links": true, "widget": "final", "body": "\n<p class=\"lead\">Привіт! 👋 За кілька уроків ти <b>сама<\/b> зробиш справжній сайт для книжкової бібліотеки «Книжковий Рай» — і він буде в інтернеті, з посиланням, яке можна надіслати вчительці.<\/p>\n<p>Праворуч (або нижче) — як сайт виглядатиме в кінці. Його можна погортати.<\/p>\n<h3>Сайт складається з двох мов<\/h3>\n<div class=\"duo\">\n  <div class=\"duo-card html-c\"><div class=\"duo-ico\">🧱<\/div><b>HTML<\/b><span>— це <b>що<\/b> є на сторінці: заголовки, картинки, кнопки, текст. Як цеглинки й меблі в кімнаті.<\/span><code>index.html<\/code><\/div>\n  <div class=\"duo-card css-c\"><div class=\"duo-ico\">🎨<\/div><b>CSS<\/b><span>— це <b>як<\/b> воно виглядає: кольори, шрифти, розміри, відступи. Як фарба й декор у тій кімнаті.<\/span><code>style.css<\/code><\/div>\n<\/div>\n<p>Браузер (Chrome, Edge, Opera) читає обидва файли й малює з них сторінку. Ми спочатку збудуємо «кімнату» (HTML), а потім пофарбуємо (CSS).<\/p>\n<h3>Як працювати з цим підручником<\/h3>\n<ol class=\"nice\">\n<li>Читай пояснення кроку.<\/li>\n<li>Прочитай <b>завдання<\/b> і спробуй написати код сама.<\/li>\n<li>Натисни «Показати код», щоб звірити. Застрягла — копіюй, нічого страшного.<\/li>\n<li>Збережи файл (<kbd>Ctrl<\/kbd>+<kbd>S<\/kbd>) і онови сторінку в браузері (<kbd>F5<\/kbd>). Порівняй із прев’ю.<\/li>\n<li>Натисни «Зроблено ✓» і йди далі.<\/li>\n<\/ol>\n", "preview": "<!DOCTYPE html>\n<html lang=\"uk\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Книжковий Рай<\/title>\n    <link href=\"https://fonts.googleapis.com/css2?family=Lora:wght@700&family=Roboto:wght@400;700&display=swap\" rel=\"stylesheet\">\n    <style>\n/* ===== Уся сторінка ===== */\nbody {\n    margin: 0;\n    font-family: 'Roboto', sans-serif;\n    color: #333;\n    background-color: #eaeaea;\n    font-size: 16px;\n}\n\n/* ===== Секція 1: зелена шапка ===== */\n.section-main {\n    background-color: #556b2f;\n    padding-top: 40px;\n    padding-bottom: 120px;\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n}\n\n.section-main-logo {\n    width: 160px;\n}\n\n.section-main-title {\n    margin-top: 40px;\n    margin-bottom: 20px;\n    color: #fff;\n    font-family: 'Lora', serif;\n    font-size: 55px;\n    font-weight: 700;\n}\n\n.section-main-subtitle {\n    margin-bottom: 40px;\n    color: #fff;\n    font-size: 22px;\n}\n\n.section-main-button {\n    background-color: #8fbc8f;\n    border: none;\n    border-radius: 25px;\n    color: #fff;\n    font-weight: bold;\n    text-transform: uppercase;\n    padding: 12px 30px;\n    cursor: pointer;\n}\n\n/* ===== Секція 2: про бібліотеку ===== */\n.second-section {\n    display: flex;\n    justify-content: space-evenly;\n    align-items: center;\n    padding-top: 100px;\n    padding-bottom: 100px;\n}\n\n.second-section-img {\n    width: 500px;\n    border: 5px solid #556b2f;\n    border-radius: 20px;\n}\n\n.second-section-info {\n    margin-left: 30px;\n    max-width: 600px;\n}\n\n.section-subtitle {\n    margin-top: 0;\n    margin-bottom: 10px;\n    color: #8fbc8f;\n    font-size: 18px;\n    font-weight: bold;\n    text-transform: uppercase;\n}\n\n.section-title {\n    margin-top: 0;\n    margin-bottom: 40px;\n    color: #556b2f;\n    font-size: 32px;\n    font-weight: bold;\n    text-transform: capitalize;\n}\n\n.second-section-text {\n    margin-bottom: 30px;\n    color: #666;\n    font-size: 18px;\n}\n\n.second-section-name {\n    color: #556b2f;\n    text-transform: capitalize;\n}\n\n.second-section-name2 {\n    color: #8fbc8f;\n    font-weight: bold;\n    text-transform: uppercase;\n}\n\n/* ===== Секція 3: книжки ===== */\n.third-section {\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    background-color: #f5f5f5;\n    padding-top: 100px;\n    padding-bottom: 100px;\n}\n\n.third-section-books {\n    display: flex;\n    justify-content: center;\n    align-items: center;\n    margin-top: 50px;\n    flex-wrap: wrap;\n}\n\n.third-section-book {\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    margin: 10px 20px;\n}\n\n.book-img {\n    height: 200px;\n}\n\n.book-title {\n    margin-top: 10px;\n    margin-bottom: 5px;\n    color: #556b2f;\n    font-size: 22px;\n    font-weight: bold;\n}\n\n.book-author {\n    margin-top: 2px;\n    margin-bottom: 2px;\n    color: #666;\n}\n\n.book-price {\n    margin: 0;\n    color: #8fbc8f;\n    font-size: 20px;\n    font-weight: bold;\n}\n\n/* ===== Секція 4: футер ===== */\n.footer {\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    background-color: #2f4f4f;\n    padding-top: 100px;\n    padding-bottom: 100px;\n}\n\n.footer-title {\n    color: #fff;\n}\n\n.footer-text {\n    width: 600px;\n    text-align: center;\n    margin-top: 0;\n    margin-bottom: 20px;\n    color: #8fbc8f;\n    font-size: 20px;\n}\n\n.footer-text-main {\n    color: #fff;\n}\n\n.footer-form {\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n}\n\n.form-title {\n    margin-top: 20px;\n    margin-bottom: 10px;\n    text-align: center;\n    color: #fff;\n    font-weight: bold;\n    text-transform: uppercase;\n}\n\n.form-input {\n    width: 400px;\n    height: 40px;\n    margin-bottom: 10px;\n    padding: 0 10px;\n    background-color: #2f4f4f;\n    color: #fff;\n    border: 1px solid #fff;\n    border-radius: 8px;\n}\n\n.footer-button {\n    margin-top: 30px;\n    padding: 10px 20px;\n    background-color: #8fbc8f;\n    color: #fff;\n    font-weight: bold;\n    border: none;\n    border-radius: 25px;\n    cursor: pointer;\n}\n<\/style>\n<\/head>\n<body>\n    <main class=\"section-main\">\n        <img class=\"section-main-logo\" src=\"img/logo.png\" alt=\"логотип\">\n        <h1 class=\"section-main-title\">Книжковий Рай<\/h1>\n        <h2 class=\"section-main-subtitle\">Відкрий для себе наступну чудову книгу<\/h2>\n        <button class=\"section-main-button\" type=\"button\">Дізнатися більше<\/button>\n    <\/main>\n\n    <section class=\"second-section\">\n        <img class=\"second-section-img\" src=\"img/library.jpeg\" alt=\"зображення бібліотеки\">\n        <div class=\"second-section-info\">\n            <h3 class=\"section-subtitle\">Ласкаво просимо до Книжкового Раю<\/h3>\n            <h3 class=\"section-title\">Про нашу бібліотеку<\/h3>\n            <p class=\"second-section-text\">Ласкаво просимо до нашої бібліотеки, де ви знайдете широкий вибір книг для будь-якого віку та вподобань. Приходьте та насолоджуйтеся читанням у затишній атмосфері<\/p>\n            <p class=\"second-section-name\"><span class=\"second-section-name2\">Іван Іваненко<\/span> — засновник Книжкового Раю<\/p>\n        <\/div>\n    <\/section>\n\n    <section class=\"third-section\">\n        <h3 class=\"section-subtitle\">Рекомендовані книги<\/h3>\n        <h3 class=\"section-title\">Наша колекція<\/h3>\n        <div class=\"third-section-books\">\n            <div class=\"third-section-book\">\n                <img src=\"img/book1.png\" alt=\"книга 1\" class=\"book-img\">\n                <h4 class=\"book-title\">Маленький принц<\/h4>\n                <p class=\"book-author\">Антуан де Сент-Екзюпері<\/p>\n                <p class=\"book-price\">150 грн<\/p>\n            <\/div>\n            <div class=\"third-section-book\">\n                <img src=\"img/book2.png\" alt=\"книга 2\" class=\"book-img\">\n                <h4 class=\"book-title\">Аліса в Країні Чудес<\/h4>\n                <p class=\"book-author\">Льюїс Керрол<\/p>\n                <p class=\"book-price\">180 грн<\/p>\n            <\/div>\n            <div class=\"third-section-book\">\n                <img src=\"img/book3.png\" alt=\"книга 3\" class=\"book-img\">\n                <h4 class=\"book-title\">Тіні забутих предків<\/h4>\n                <p class=\"book-author\">Михайло Коцюбинський<\/p>\n                <p class=\"book-price\">120 грн<\/p>\n            <\/div>\n            <div class=\"third-section-book\">\n                <img src=\"img/book4.png\" alt=\"книга 4\" class=\"book-img\">\n                <h4 class=\"book-title\">Пригоди Тома Сойєра<\/h4>\n                <p class=\"book-author\">Марк Твен<\/p>\n                <p class=\"book-price\">160 грн<\/p>\n            <\/div>\n        <\/div>\n    <\/section>\n\n    <footer class=\"footer\">\n        <h3 class=\"section-subtitle\">Книжковий Рай<\/h3>\n        <h3 class=\"section-title footer-title\">Приєднуйтесь до нашої спільноти<\/h3>\n        <p class=\"footer-text\"><span class=\"footer-text-main\">Підпишіться на нашу розсилку, щоб отримувати останні новини про новинки, ексклюзивні пропозиції та багато іншого.<\/span><br>Для запитів, будь ласка, зв'яжіться з нами за номером (+380) 123-456-789<\/p>\n        <form action=\"\" class=\"footer-form\">\n            <p class=\"form-title\">Ім'я<\/p>\n            <input type=\"text\" id=\"name\" class=\"form-input\">\n            <p class=\"form-title\">Електронна пошта<\/p>\n            <input type=\"email\" id=\"email\" class=\"form-input\">\n            <p class=\"form-title\">Телефон<\/p>\n            <input type=\"tel\" id=\"phone\" class=\"form-input\">\n            <button class=\"footer-button\">Підписатися<\/button>\n        <\/form>\n    <\/footer>\n<\/body>\n<\/html>\n"}, {"id": "setup", "part": "Старт", "title": "Готуємо робоче місце", "html": null, "css": null, "widget": "gallery", "body": "\n<h3>1. Програма для коду<\/h3>\n<p>Найзручніше — безкоштовний редактор <a href=\"https://code.visualstudio.com/\" target=\"_blank\" rel=\"noopener\">Visual Studio Code<\/a>. Він підсвічує код кольорами й підказує. Якщо його немає — підійде навіть звичайний Блокнот.<\/p>\n<h3>2. Папки й файли<\/h3>\n<p>На робочому столі створи таку структуру — назви мають бути <b>точно такі<\/b>, маленькими літерами:<\/p>\n<pre class=\"tree\">📁 Book heaven\n ├── 📁 img          ← тут будуть картинки\n ├── 📄 index.html   ← розмітка (HTML)\n └── 📄 style.css    ← стилі (CSS)<\/pre>\n<p class=\"note\">💡 У VS Code: <b>File → Open Folder<\/b> → обери «Book heaven». Потім у панелі зліва кнопками <b>New File<\/b> / <b>New Folder<\/b> створи файли й папку.<\/p>\n<p class=\"warn\">⚠️ Якщо працюєш у Блокноті, при збереженні обери «Тип файлу: Усі файли», інакше вийде <code>index.html.txt<\/code>, і нічого не запрацює.<\/p>\n<h3>3. Картинки<\/h3>\n<p>Збережи ці 6 картинок у папку <b>img<\/b>. Натисни на кожну <b>правою кнопкою миші → «Зберегти зображення як…»<\/b> і залиш таку саму назву, як підписано. (Мама має їх і одним архівом.)<\/p>\n"}, {"id": "skeleton", "part": "HTML", "title": "Скелет сторінки", "html": 0, "css": 0, "links": false, "body": "\n<p>Кожна HTML-сторінка починається однаково — зі «скелета». Це як обкладинка й форзац у книжці: читач їх майже не помічає, але без них книжка розсиплеться.<\/p>\n<h3>Що таке тег<\/h3>\n<p>HTML складається з <b>тегів<\/b> — слів у кутових дужках. Більшість тегів ходять парами: відкривальний і закривальний (з похилою рискою):<\/p>\n<pre class=\"mini\"><span class=\"t\">&lt;title&gt;<\/span>Книжковий Рай<span class=\"t\">&lt;/title&gt;<\/span><\/pre>\n<p>Теги вкладаються один в одний, як матрьошки. Тому ми робимо відступи — щоб було видно, що всередині чого.<\/p>\n<ul class=\"nice\">\n<li><code>&lt;head&gt;<\/code> — «голова»: службова інформація, якої на сторінці не видно (назва вкладки, мова, кодування).<\/li>\n<li><code>&lt;body&gt;<\/code> — «тіло»: усе, що бачить відвідувач.<\/li>\n<\/ul>\n", "task": ["Відкрий <code>index.html<\/code>.", "Напиши стандартну структуру <code>&lt;html&gt;<\/code>, <code>&lt;head&gt;<\/code>, <code>&lt;body&gt;<\/code>.", "У тезі <code>&lt;title&gt;<\/code> назви сайт «Книжковий Рай».", "Збережи і відкрий <code>index.html<\/code> у браузері (подвійний клік по файлу)."], "code": [{"file": "index.html", "lang": "html", "where": "Весь файл index.html", "snippet": "<!DOCTYPE html>\n<html lang=\"uk\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Книжковий Рай<\/title>\n<\/head>\n<body>\n\n<\/body>\n<\/html>"}], "after": "<p>Сторінка поки біла — це нормально! Але подивись на <b>вкладку<\/b> браузера: там написано «Книжковий Рай». Це працює <code>&lt;title&gt;<\/code>. 🎉<\/p>", "words": [["&lt;!DOCTYPE html&gt;", "каже браузеру: «це сучасний HTML»"], ["lang=\"uk\"", "мова сторінки — українська"], ["charset=\"UTF-8\"", "щоб українські літери не стали «кракозябрами»"], ["viewport", "щоб сайт нормально виглядав на телефоні"]], "quiz": {"q": "Куди треба писати те, що відвідувач бачитиме на сторінці?", "options": ["У &lt;head&gt;", "У &lt;body&gt;", "У &lt;title&gt;"], "correct": 1, "explain": "Усе видиме живе в &lt;body&gt;. А &lt;head&gt; — службова «голова»."}, "preview": "<!DOCTYPE html>\n<html lang=\"uk\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Книжковий Рай<\/title>\n<\/head>\n<body>\n\n<\/body>\n<\/html>\n", "full": [{"file": "index.html", "lang": "html", "text": "<!DOCTYPE html>\n<html lang=\"uk\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Книжковий Рай<\/title>\n<\/head>\n<body>\n\n<\/body>\n<\/html>\n"}]}, {"id": "blocks", "part": "HTML", "title": "Чотири великі блоки", "html": 1, "css": 0, "links": false, "body": "\n<p>Подивись на макет: сайт складається з <b>чотирьох смуг<\/b> одна під одною. Для кожної зробимо свій блок-«коробку»:<\/p>\n<div class=\"bands\">\n  <div style=\"background:#556b2f;color:#fff\">main — зелена шапка з логотипом<\/div>\n  <div style=\"background:#eaeaea\">section — про бібліотеку<\/div>\n  <div style=\"background:#f5f5f5\">section — книжки<\/div>\n  <div style=\"background:#2f4f4f;color:#fff\">footer — підписка й контакти<\/div>\n<\/div>\n<h3>Що таке class<\/h3>\n<p><code>class<\/code> — це <b>наліпка з іменем<\/b> на коробці. HTML вона не змінює, але потім у CSS ми скажемо: «коробку з наліпкою <code>section-main<\/code> пофарбуй у зелений». Без наліпок CSS не знатиме, що де.<\/p>\n<p class=\"note\">💡 Імена класів пишемо латиницею, маленькими літерами, слова з’єднуємо дефісом: <code>second-section<\/code>.<\/p>\n", "task": ["Всередині <code>&lt;body&gt;<\/code> створи чотири блоки: <code>main<\/code>, <code>section<\/code>, <code>section<\/code> та <code>footer<\/code>.", "Дай їм класи: <code>section-main<\/code>, <code>second-section<\/code>, <code>third-section<\/code>, <code>footer<\/code>."], "code": [{"file": "index.html", "lang": "html", "where": "Встав усередину &lt;body&gt; … &lt;/body&gt;", "snippet": "    <main class=\"section-main\">\n\n    <\/main>\n\n    <section class=\"second-section\">\n\n    <\/section>\n\n    <section class=\"third-section\">\n\n    <\/section>\n\n    <footer class=\"footer\">\n\n    <\/footer>"}], "after": "<p>На сторінці досі порожньо: коробки є, але в них нічого не лежить. Наповнимо на наступних кроках.<\/p>", "words": [["&lt;main&gt;", "головна частина сторінки"], ["&lt;section&gt;", "розділ сторінки"], ["&lt;footer&gt;", "«підвал» — низ сторінки"], ["class=\"…\"", "ім’я-наліпка для CSS"]], "preview": "<!DOCTYPE html>\n<html lang=\"uk\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Книжковий Рай<\/title>\n<\/head>\n<body>\n    <main class=\"section-main\">\n\n    <\/main>\n\n    <section class=\"second-section\">\n\n    <\/section>\n\n    <section class=\"third-section\">\n\n    <\/section>\n\n    <footer class=\"footer\">\n\n    <\/footer>\n<\/body>\n<\/html>\n", "full": [{"file": "index.html", "lang": "html", "text": "<!DOCTYPE html>\n<html lang=\"uk\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Книжковий Рай<\/title>\n<\/head>\n<body>\n    <main class=\"section-main\">\n\n    <\/main>\n\n    <section class=\"second-section\">\n\n    <\/section>\n\n    <section class=\"third-section\">\n\n    <\/section>\n\n    <footer class=\"footer\">\n\n    <\/footer>\n<\/body>\n<\/html>\n"}]}, {"id": "html-main", "part": "HTML", "title": "Шапка: логотип і заголовок", "html": 2, "css": 0, "links": false, "body": "\n<p>Наповнюємо першу коробку <code>main<\/code>. У ній 4 речі: логотип, великий заголовок, підзаголовок і кнопка.<\/p>\n<h3>Картинка: тег &lt;img&gt;<\/h3>\n<p><code>&lt;img&gt;<\/code> — тег <b>без пари<\/b> (закривати не треба). Йому потрібні атрибути:<\/p>\n<ul class=\"nice\">\n<li><code>src=\"img/logo.png\"<\/code> — <b>де лежить<\/b> картинка: у папці <code>img<\/code>, файл <code>logo.png<\/code>.<\/li>\n<li><code>alt=\"логотип\"<\/code> — <b>опис словами<\/b>. Його покаже браузер, якщо картинка не завантажиться, і прочитає програма для незрячих людей.<\/li>\n<\/ul>\n<p class=\"warn\">⚠️ У підручнику написано просто <code>src=\"logo.png\"<\/code>. Але ми поклали картинки в папку <b>img<\/b>, тому шлях — <code>img/logo.png<\/code>. Інакше браузер картинку не знайде.<\/p>\n<h3>Заголовки h1…h6<\/h3>\n<p><code>&lt;h1&gt;<\/code> — найголовніший і найбільший заголовок (на сторінці один!), <code>&lt;h2&gt;<\/code> — трохи менший, і так до <code>&lt;h6&gt;<\/code>.<\/p>\n", "task": ["Усередині <code>main<\/code> додай картинку-логотип <code>img/logo.png<\/code>.", "Заголовок <code>h1<\/code>: «Книжковий Рай».", "Підзаголовок <code>h2<\/code>: «Відкрий для себе наступну чудову книгу».", "Кнопку <code>button<\/code>: «Дізнатися більше».", "Класи: <code>section-main-logo<\/code>, <code>section-main-title<\/code>, <code>section-main-subtitle<\/code>, <code>section-main-button<\/code>."], "code": [{"file": "index.html", "lang": "html", "where": "Заміни порожній блок main на цей", "snippet": "    <main   get(k, d){ try{ const v = localStorage.getItem('bh-'+k); return v===null? d : JSON.parse(v);}catch(e){return d;} },
  set(k, v){ try{ localStorage.setItem('bh-'+k, JSON.stringify(v)); }catch(e){} }
};
let done = store.get('done', {});
let checks = store.get('checks', {});
let cur = 0;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('on'),1800); }
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); toast('Скопійовано ✓'); }
  catch(e){
    try{ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('Скопійовано ✓'); }
    catch(e2){ toast('Не вдалося скопіювати — виділи код мишкою'); }
  }
}

/* ---------- syntax highlight ---------- */
function hlHTML(code){
  let out=''; const re=/(<!--[\s\S]*?-->)|(<\/?[a-zA-Z!][^>]*>)/g; let last=0, m;
  while((m=re.exec(code))){
    out+=esc(code.slice(last,m.index));
    if(m[1]) out+='<span class="hl-com">'+esc(m[1])+'</span>';
    else{
      const tag=m[2]; const mm=tag.match(/^<(\/?)([a-zA-Z!][\w-]*)([\s\S]*?)(\/?)>$/);
      if(!mm){ out+=esc(tag); }
      else{
        let attrs=esc(mm[3]).replace(/([\w-]+)(=)(&quot;|")([^"]*?)(")/g,'<span class="hl-attr">$1</span>$2<span class="hl-str">"$4"</span>')
                             .replace(/(^|\s)([\w-]+)(?=\s|$)/g,'$1<span class="hl-attr">$2</span>');
        out+='<span class="hl-tag">&lt;'+mm[1]+mm[2]+'</span>'+attrs+'<span class="hl-tag">'+mm[4]+'&gt;</span>';
      }
    }
    last=re.lastIndex;
  }
  return out+esc(code.slice(last));
}
function hlCSS(code){
  return code.split('\n').map(line=>{
    if(/^\s*\/\*.*\*\/\s*$/.test(line)) return '<span class="hl-com">'+esc(line)+'</span>';
    let m=line.match(/^(\s*)([^{]+?)(\s*\{)\s*$/);
    if(m) return m[1]+'<span class="hl-sel">'+esc(m[2])+'</span><span class="hl-punc">'+m[3]+'</span>';
    m=line.match(/^(\s*)([\w-]+)(\s*:\s*)(.*?)(;?)\s*$/);
    if(m) return m[1]+'<span class="hl-prop">'+m[2]+'</span><span class="hl-punc">'+m[3]+'</span><span class="hl-val">'+esc(m[4])+'</span><span class="hl-punc">'+m[5]+'</span>';
    return '<span class="hl-punc">'+esc(line)+'</span>';
  }).join('\n');
}
const hl = (lang, code) => lang==='css' ? hlCSS(code) : hlHTML(code);

/* ---------- nav ---------- */
function renderNav(){
  let h='', part='';
  STEPS.forEach((s,i)=>{
    if(s.part!==part){ part=s.part; h+=`<h4>${part}</h4>`; }
    h+=`<button class="${i===cur?'on':''} ${done[s.id]?'done':''}" data-i="${i}"><span class="dot">${done[s.id]?'✓':i+1}</span>${s.title}</button>`;
  });
  $('#nav').innerHTML=h;
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{ go(+b.dataset.i); $('#nav').classList.remove('open'); });
  const n=STEPS.filter(s=>done[s.id]).length;
  $('#barFill').style.width=(n/STEPS.length*100)+'%';
  $('#progTxt').textContent=`Зроблено ${n} з ${STEPS.length}`;
}

/* ---------- widgets ---------- */
const IMGS=['logo.png','library.jpeg','book1.png','book2.png','book3.png','book4.png'];
function widget(s){
  switch(s.widget){
  case 'gallery':
    return `<div class="gallery">${IMGS.map(f=>`<figure><img src="img/${f}" alt="${f}" class="${f==='logo.png'?'logo-bg':''}"><figcaption>${f}</figcaption></figure>`).join('')}</div>
    <p class="note">💡 Логотип білий і прозорий — тому тут він на зеленому тлі, щоб його було видно.</p>`;
  case 'colors':
    return `<h3>Наші кольори</h3><div class="swatches">${[['#556b2f','зелений'],['#8fbc8f','світло-зелений'],['#2f4f4f','темний футер'],['#666','сірий'],['#333','текст'],['#eaeaea','фон'],['#fff','білий']].map(([c,n])=>`<div class="sw"><i style="background:${c}"></i><code>${c}</code> ${n}</div>`).join('')}</div>`;
  case 'flex':
    return `<div class="flexlab"><div class="flexctl">
      <div>flex-direction<div class="seg" data-p="flexDirection">${['row','column'].map(v=>`<button data-v="${v}" class="${v==='column'?'on':''}">${v}</button>`).join('')}</div></div>
      <div>align-items<div class="seg" data-p="alignItems">${['flex-start','center','flex-end'].map(v=>`<button data-v="${v}" class="${v==='center'?'on':''}">${v}</button>`).join('')}</div></div>
      <div>justify-content<div class="seg" data-p="justifyContent">${['flex-start','center','space-evenly'].map(v=>`<button data-v="${v}" class="${v==='flex-start'?'on':''}">${v}</button>`).join('')}</div></div>
    </div><div class="flexbox" id="fbox" style="flex-direction:column;align-items:center;justify-content:flex-start"><span>📖 лого</span><span>Книжковий Рай</span><span>кнопка</span></div><div class="flexcode" id="fcode"></div></div>`;
  case 'box':
    return `<div class="boxmodel"><div class="bm-margin"><span class="bm-l" style="color:#b0652a">margin — зовні</span><div class="bm-border"><div class="bm-padding"><span class="bm-l" style="color:var(--green)">padding — всередині</span><div class="bm-content">вміст (текст, картинка)</div></div></div></div></div>
    <p style="text-align:center;color:var(--muted);font-size:15px;margin-top:-4px">Зелена лінія — це <code>border</code> (рамка)</p>`;
  case 'checklist': {
    const items=['Логотип, назва і кнопка — по центру на зеленому тлі','Над кнопкою курсор стає пальчиком','Картинка бібліотеки з зеленою рамкою й заокругленими кутами, текст праворуч','Ім’я «ІВАН ІВАНЕНКО» світло-зелене і жирне','4 книжки в ряд; при звуженні вікна переносяться','Футер темний, поля з білою рамкою, кнопка «Підписатися» заокруглена','Українські літери скрізь відображаються правильно','Перевірено в Chrome','Перевірено в Opera','Перевірено в Edge'];
    return `<h3>Чек-лист</h3><div class="checks">${items.map((t,i)=>`<label><input type="checkbox" data-k="t${i}" ${checks['t'+i]?'checked':''}> <span>${t}</span></label>`).join('')}</div>`;
  }
  case 'github':
    return `<p class="note">✅ Мама вже створила «папку проєкту» (репозиторій) <b>book-heaven</b> на GitHub і ввімкнула сайт. Зараз там лежить зразок з підручника. Твоє завдання — замінити його <b>своїми</b> файлами, щоб за посиланням відкривався твій сайт.</p>
    <div class="gh">
      <div class="gh-step"><h4>Відкрий репозиторій</h4><p>Разом з мамою (потрібен її вхід у GitHub) відкрий <a href="https://github.com/azizovakate/book-heaven" target="_blank" rel="noopener">github.com/azizovakate/book-heaven</a>.</p></div>
      <div class="gh-step"><h4>Завантаж свої файли</h4><p>Натисни <span class="ghb">Add file</span> → <span class="ghb">Upload files</span>.</p>
        <p>Відкрий на комп’ютері папку <b>Book heaven</b>, виділи <b>все, що всередині</b> (<code>index.html</code>, <code>style.css</code> і папку <code>img</code>) і перетягни у вікно браузера. Файли з такими самими назвами замінять старі.</p>
        <p class="warn">⚠️ Перетягуй <b>вміст</b> папки, а не саму папку «Book heaven». Інакше <code>index.html</code> опиниться всередині ще однієї папки й сайт його не побачить.</p>
        <p>Унизу натисни <span class="ghb green">Commit changes</span>.</p></div>
      <div class="gh-step"><h4>Зачекай 1–2 хвилини й перевір сайт</h4><p>Відкрий адресу нижче й онови сторінку (<kbd>Ctrl</kbd>+<kbd>F5</kbd>). Має з’явитися саме твій варіант.</p>
        <div class="urlbox"><span>${SITE_URL}</span><button class="cbtn" data-copy="${SITE_URL}">Копіювати</button></div>
        <p>Перевір, що все виглядає як на комп’ютері.</p></div>
    </div>
    <h3>Якщо щось пішло не так</h3>
    <div class="bugs">
      <details><summary>Пише «404 — There isn’t a GitHub Pages site here»</summary><p>Зачекай ще кілька хвилин. Перевір, що файл називається точно <code>index.html</code> (маленькими літерами) і лежить на верхньому рівні репозиторію, а не в папці «Book heaven».</p></details>
      <details><summary>На комп’ютері картинки є, а на сайті — ні</summary><p>GitHub розрізняє великі й малі літери, а Windows — ні. Якщо файл називається <code>Logo.PNG</code>, а в коді <code>img/logo.png</code> — на GitHub картинка не знайдеться. Перейменуйте, щоб усе збігалося. Також перевірте, що папка <code>img</code> завантажилась разом з картинками.</p></details>
      <details><summary>Як виправити щось після публікації?</summary><p>Виправте файл на комп’ютері, потім у репозиторії натисніть <span class="ghb">Add file</span> → <span class="ghb">Upload files</span>, перетягніть виправлений файл (з тією самою назвою — він замінить старий) і <span class="ghb green">Commit changes</span>. За хвилину сайт оновиться.</p></details>
    </div>`;
  case 'finish': {
    const msg=`Добрий день! Надсилаю свій проєкт «Книжковий Рай» (теми 18–19).\nСайт: ${SITE_URL}\nДякую!`;
    return `<h3>Повідомлення вчительці</h3><p>Скопіюй і встав у месенджер або листа (впиши своє ім’я, якщо треба):</p>
      <div class="msg">${esc(msg)}</div><p><button class="cbtn" style="background:var(--green);padding:9px 16px" data-copy="${esc(msg)}">Скопіювати повідомлення</button></p>
      <p class="note">💡 Якщо вчителька попросить ще й файли — заархівуй папку «Book heaven» (правою кнопкою → «Стиснути в ZIP») і надішли архів.</p>
      <h3>Хочеш більше? Ідеї для сміливих</h3>
      <ul class="nice"><li>Додай п’яту книжку — полиця сама перенесе її на новий рядок.</li><li>Зроби, щоб кнопка змінювала колір при наведенні: <code>.footer-button:hover { background-color: #556b2f; }</code></li><li>Зміни кольори сайту на свої улюблені.</li></ul>`;
  }
  default: return '';
  }
}
function bindWidget(s){
  if(s.widget==='flex'){
    const box=$('#fbox'), code=$('#fcode');
    const show=()=>{ code.textContent=`.section-main {\n    display: flex;\n    flex-direction: ${box.style.flexDirection};\n    align-items: ${box.style.alignItems};\n    justify-content: ${box.style.justifyContent};\n}`; };
    document.querySelectorAll('.seg').forEach(seg=>seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      seg.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); box.style[seg.dataset.p]=b.dataset.v; show();
    }));
    show();
  }
  document.querySelectorAll('.checks input').forEach(c=>c.onchange=()=>{ checks[c.dataset.k]=c.checked; store.set('checks',checks); });
}

/* ---------- preview ---------- */
const PV_W=1240;
function fitPreview(){
  document.querySelectorAll('.pvframe').forEach(f=>{
    const ifr=f.querySelector('iframe'); const sc=Math.min(1,f.clientWidth/PV_W);
    ifr.style.width=PV_W+'px'; ifr.style.height=(f.clientHeight/sc)+'px'; ifr.style.transform=`scale(${sc})`;
  });
}

/* ---------- step render ---------- */
function go(i){
  cur=Math.max(0,Math.min(STEPS.length-1,i));
  const s=STEPS[cur];
  try{ history.replaceState(null,'','#s-'+s.id); }catch(e){}
  let h=`<span class="chip ${s.part}">${s.part}</span><span class="stepno">Крок ${cur+1} з ${STEPS.length}</span><h1 class="st">${s.title}</h1>${s.body}`;
  if(s.widget && s.widget!=='final') h+=widget(s);
  if(s.task){
    h+=`<div class="task"><h5>✏️ Завдання</h5><ol>${s.task.map(t=>`<li>${t}</li>`).join('')}</ol>
       <p class="tip-type">Спробуй написати сама, а потім звір 👇 Друкувати руками корисніше, ніж копіювати — так код запам’ятовується.</p></div>
       <button class="reveal" id="revealBtn">👀 Показати код</button><div id="codeArea" hidden>`;
    s.code.forEach((c,ci)=>{
      h+=`<div class="codebox"><div class="codehead"><span class="fname ${c.lang}">${c.file}</span><span class="where">${c.where}</span><button class="cbtn" data-ci="${ci}">Копіювати</button></div><pre class="code">${hl(c.lang,c.snippet)}</pre></div>`;
    });
    if(s.full){
      h+=`<details class="fullfile"><summary>📄 Як мають виглядати файли повністю на цьому кроці</summary>`;
      s.full.forEach((f,fi)=>{ h+=`<div class="codebox"><div class="codehead"><span class="fname ${f.lang}">${f.file}</span><span class="where">весь файл</span><button class="cbtn" data-fi="${fi}">Копіювати</button></div><pre class="code">${hl(f.lang,f.text)}</pre></div>`; });
      h+=`</details>`;
    }
    h+=`</div>`;
  }
  if(s.preview){
    const cap = s.widget==='final' ? 'Так виглядатиме готовий сайт. Погортай його!' : 'Ось що має бути в браузері після цього кроку';
    h+=`<div class="pv"><div class="pvhead"><div class="dots"><i></i><i></i><i></i></div><div class="pvurl">📄 Книжковий Рай — index.html</div><button class="cbtn" id="fullBtn" style="background:#dcdccf;color:#24301c">⛶ На весь екран</button></div>
        <div class="pvframe"><iframe sandbox title="Прев’ю сайту" id="pvIframe"></iframe></div><div class="pvcap">${cap}</div></div>`;
  }
  if(s.after) h+=s.after;
  if(s.words) h+=`<h3>📘 Нові слова</h3><div class="words">${s.words.map(([w,d])=>`<div class="word"><b>${w}</b>${d}</div>`).join('')}</div>`;
  if(s.quiz){
    h+=`<div class="quiz"><h5>🧠 Перевір себе</h5><p class="q">${s.quiz.q}</p>${s.quiz.options.map((o,oi)=>`<button class="qopt" data-oi="${oi}">${o}</button>`).join('')}<div class="qres" id="qres"></div></div>`;
  }
  const last=cur===STEPS.length-1;
  h+=`<div class="stepnav"><button class="btn ghost" id="prevBtn" ${cur===0?'disabled':''}>← Назад</button><button class="btn go" id="nextBtn">${last? (done[s.id]?'🏆 Усе готово!':'Зроблено ✓') : 'Зроблено ✓ Далі →'}</button></div>`;
  $('#content').innerHTML=h;

  // binds
  const rb=$('#revealBtn'); if(rb) rb.onclick=()=>{ $('#codeArea').hidden=false; rb.remove(); };
  document.querySelectorAll('[data-ci]').forEach(b=>b.onclick=()=>copyText(s.code[+b.dataset.ci].snippet));
  document.querySelectorAll('[data-fi]').forEach(b=>b.onclick=()=>copyText(s.full[+b.dataset.fi].text));
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyText(b.dataset.copy));
  document.querySelectorAll('.qopt').forEach(b=>b.onclick=()=>{
    const ok=+b.dataset.oi===s.quiz.correct;
    document.querySelectorAll('.qopt').forEach(x=>x.classList.remove('right','wrong'));
    b.classList.add(ok?'right':'wrong');
    $('#qres').innerHTML= ok ? '✅ '+s.quiz.explain : '🤔 Не зовсім. Спробуй ще раз!';
  });
  if(s.preview){
    const ifr=$('#pvIframe'); ifr.srcdoc=s.preview; fitPreview();
    $('#fullBtn').onclick=()=>{ $('#ovFrame').srcdoc=s.preview; $('#overlay').classList.add('on'); };
  }
  bindWidget(s);
  $('#prevBtn').onclick=()=>go(cur-1);
  $('#nextBtn').onclick=()=>{
    done[s.id]=true; store.set('done',done);
    if(last){ renderNav(); go(cur); toast('🏆 Молодець!'); } else { go(cur+1); }
  };
  renderNav();
  window.scrollTo({top:0});
  store.set('cur',cur);
}

$('#ovClose').onclick=()=>$('#overlay').classList.remove('on');
$('#menuBtn').onclick=()=>$('#nav').classList.toggle('open');
window.addEventListener('resize',fitPreview);
function fromHash(){ const id=(location.hash||'').replace('#s-',''); const i=STEPS.findIndex(s=>s.id===id); return i; }
window.addEventListener('hashchange',()=>{ const i=fromHash(); if(i>=0 && i!==cur) go(i); });
const hi=fromHash(); go(hi>=0? hi : store.get('cur',0));
</script>
</body>
</html>
