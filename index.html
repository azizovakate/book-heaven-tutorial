<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Книжковий Рай — робимо сайт самі</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Roboto:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>

:root{
  --green:#556b2f; --green2:#8fbc8f; --deep:#2f4f4f; --paper:#fbfaf5; --ink:#24301c; --muted:#5f6b58;
  --line:#e1e4d6; --card:#fff; --html:#d9653b; --css:#2f7fb5; --warn:#fff3d6; --warnb:#e8b64a;
  --note:#eef5e6; --noteb:#8fbc8f;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Roboto',system-ui,sans-serif;color:var(--ink);background:var(--paper);font-size:17px;line-height:1.6}
a{color:var(--green)}
code,kbd,pre{font-family:'JetBrains Mono',ui-monospace,monospace}
code{background:#eef0e6;border-radius:5px;padding:1px 6px;font-size:.86em;color:#3c4a2a;white-space:nowrap}
kbd{background:#fff;border:1px solid #cfd3c3;border-bottom-width:3px;border-radius:6px;padding:0 6px;font-size:.82em}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:12px 22px;background:var(--green);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.brand{display:flex;align-items:center;gap:10px;font-family:'Lora',serif;font-weight:700;font-size:20px;white-space:nowrap}
.brand img{width:30px}
.prog{flex:1;display:flex;align-items:center;gap:12px;min-width:120px}
.bar{flex:1;height:10px;background:rgba(255,255,255,.22);border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--green2);border-radius:10px;transition:width .4s}
.prog span{font-size:14px;white-space:nowrap;opacity:.95}
.menu-btn{display:none;background:none;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;padding:4px 10px;font-size:15px;cursor:pointer}

/* ---------- layout ---------- */
.wrap{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 58px)}
nav{border-right:1px solid var(--line);padding:18px 12px 40px;background:#f4f3ea;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto}
nav h4{margin:18px 10px 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
nav h4:first-child{margin-top:0}
nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:9px;font:inherit;font-size:15px;color:var(--ink);cursor:pointer;line-height:1.3}
nav button:hover{background:#e9e9dc}
nav button.on{background:var(--green);color:#fff}
nav .dot{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:#fff;border:2px solid #cdd3bf;color:var(--muted)}
nav button.done .dot{background:var(--green2);border-color:var(--green2);color:#fff}
nav button.on .dot{border-color:#fff}
main.content{padding:34px 48px 80px;max-width:980px;width:100%}

/* ---------- step ---------- */
.chip{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:20px;background:#e5ead9;color:var(--green)}
.chip.HTML{background:#fbe5dc;color:var(--html)} .chip.CSS{background:#dcebf6;color:var(--css)}
.stepno{color:var(--muted);font-size:14px;margin-left:8px}
h1.st{font-family:'Lora',serif;font-size:38px;line-height:1.15;margin:10px 0 18px;color:var(--green)}
h3{font-family:'Lora',serif;font-size:22px;color:var(--deep);margin:28px 0 8px}
.lead{font-size:20px}
.note,.warn{border-radius:12px;padding:12px 16px;margin:14px 0}
.note{background:var(--note);border-left:5px solid var(--noteb)}
.warn{background:var(--warn);border-left:5px solid var(--warnb)}
ul.nice,ol.nice{padding-left:22px} ul.nice li,ol.nice li{margin:6px 0}
pre.tree{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 18px;font-size:15px;line-height:1.7;overflow:auto}
pre.mini{background:#1f2a1c;color:#e9eedf;border-radius:10px;padding:12px 16px;font-size:15px;overflow:auto}
pre.mini .t{color:#ff9b73} pre.mini .s{color:#ffd479} pre.mini .p{color:#8fd1ff} pre.mini .v{color:#b5e08a} pre.mini .c{color:#8c9a84}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.duo-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.duo-card b{font-size:22px} .duo-ico{font-size:30px} .duo-card code{align-self:flex-start}
.html-c{border-top:5px solid var(--html)} .css-c{border-top:5px solid var(--css)}
.bands div{padding:12px 16px;font-weight:500;font-size:15px;border:1px solid var(--line);border-bottom:0}
.bands{border-bottom:1px solid var(--line);border-radius:12px;overflow:hidden;margin:12px 0}
.cardmap{display:flex;align-items:center;gap:18px;margin:14px 0;flex-wrap:wrap}
.cm-card{background:#fff;border:2px dashed var(--green2);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:'JetBrains Mono',monospace;font-size:12px;width:150px}
.cm-img{width:80px;height:110px;background:#2f5d8a;color:#fff;display:grid;place-items:center;border-radius:4px}
.cm-t{color:var(--green);font-weight:700} .cm-a{color:#666} .cm-p{color:var(--green2);font-weight:700}
.cm-arrow{color:var(--muted);font-size:15px}

/* task card */
.task{background:#fff;border:2px solid var(--green);border-radius:16px;padding:16px 20px 12px;margin:26px 0 14px;position:relative}
.task h5{margin:0 0 6px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--green)}
.task ol{margin:0;padding-left:22px} .task li{margin:5px 0}
.tip-type{font-size:14px;color:var(--muted);margin:8px 0 0}
.reveal{display:inline-flex;align-items:center;gap:8px;margin:6px 0 4px;background:var(--deep);color:#fff;border:0;border-radius:24px;padding:11px 22px;font:inherit;font-weight:700;cursor:pointer}
.reveal:hover{filter:brightness(1.15)}

/* code */
.codebox{margin:14px 0 18px;border-radius:14px;overflow:hidden;background:#1f2a1c;box-shadow:0 4px 18px rgba(0,0,0,.08)}
.codehead{display:flex;align-items:center;gap:10px;padding:9px 12px 9px 16px;background:#2a3826;color:#dfe6d4;font-size:14px;flex-wrap:wrap}
.fname{font-family:'JetBrains Mono',monospace;font-weight:600;padding:2px 9px;border-radius:6px;font-size:13px}
.fname.html{background:var(--html);color:#fff} .fname.css{background:var(--css);color:#fff}
.where{flex:1;min-width:150px;opacity:.9}
.cbtn{background:#3f5139;color:#fff;border:0;border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.cbtn:hover{background:#4e6446}
pre.code{margin:0;padding:16px 18px;color:#e9eedf;font-size:14.5px;line-height:1.6;overflow:auto;max-height:520px;tab-size:4}
.hl-tag{color:#ff9b73} .hl-attr{color:#ffd479} .hl-str{color:#b5e08a} .hl-com{color:#8c9a84;font-style:italic}
.hl-sel{color:#ffd479} .hl-prop{color:#8fd1ff} .hl-val{color:#b5e08a} .hl-punc{color:#c9d2bd}
.fullfile{margin:-6px 0 18px}
.fullfile summary{cursor:pointer;color:var(--muted);font-size:15px}

/* preview */
.pv{margin:26px 0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.pvhead{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#efefe6;border-bottom:1px solid var(--line);font-size:14px;color:var(--muted)}
.dots{display:flex;gap:6px}.dots i{width:11px;height:11px;border-radius:50%;background:#e06c5a;display:block}.dots i:nth-child(2){background:#e6b64a}.dots i:nth-child(3){background:#78b45c}
.pvurl{flex:1;background:#fff;border-radius:7px;padding:3px 10px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pvframe{position:relative;height:540px;overflow:hidden}
.pvframe iframe{border:0;transform-origin:0 0;position:absolute;left:0;top:0;background:#fff}
.pvcap{padding:8px 14px;font-size:14px;color:var(--muted);border-top:1px solid var(--line);background:#fafaf4}

/* words */
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:10px 0}
.word{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14.5px;line-height:1.4}
.word b{display:block;font-family:'JetBrains Mono',monospace;color:var(--deep);font-size:14px;margin-bottom:3px}

/* quiz */
.quiz{background:#f1f6fb;border:1px solid #cfe1ef;border-radius:16px;padding:16px 20px;margin:26px 0}
.quiz h5{margin:0 0 4px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--css)}
.quiz p.q{font-weight:500;margin:4px 0 10px}
.qopt{display:block;width:100%;text-align:left;margin:7px 0;padding:10px 14px;border-radius:10px;border:2px solid #cfe1ef;background:#fff;font:inherit;cursor:pointer}
.qopt:hover{border-color:var(--css)}
.qopt.right{border-color:#5aa04a;background:#eaf6e4}
.qopt.wrong{border-color:#d9653b;background:#fdece6}
.qres{margin-top:8px;font-weight:500}

/* nav buttons */
.stepnav{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:22px;border-top:1px solid var(--line)}
.btn{border:0;border-radius:28px;padding:13px 26px;font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:#ecece1;color:var(--ink)}
.btn.go{background:var(--green);color:#fff}
.btn.go:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.4;cursor:default}

/* widgets */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin:12px 0}
.gallery figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.gallery img{max-width:100%;height:130px;object-fit:contain;display:block;margin:0 auto 6px}
.gallery .logo-bg{background:var(--green);border-radius:8px}
.gallery figcaption{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600}
.swatches{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.sw{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:30px;padding:5px 14px 5px 5px;font-size:14px}
.sw i{width:28px;height:28px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.12)}
.sw code{background:none;padding:0}

.flexlab{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
.flexctl{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:12px}
.flexctl div{display:flex;flex-direction:column;gap:5px;font-size:13px;font-family:'JetBrains Mono',monospace;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid #cdd3bf;background:#f6f6ee;border-radius:7px;padding:4px 9px;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--green);color:#fff;border-color:var(--green)}
.flexbox{display:flex;min-height:230px;background:#556b2f;border-radius:12px;padding:14px;gap:10px;transition:all .3s}
.flexbox span{background:#fff;border-radius:8px;padding:10px 14px;font-weight:700;color:var(--green)}
.flexbox span:nth-child(2){padding:16px 26px;font-family:'Lora',serif;font-size:20px}
.flexcode{margin-top:10px;font-family:'JetBrains Mono',monospace;font-size:13.5px;background:#1f2a1c;color:#e9eedf;border-radius:10px;padding:10px 14px;white-space:pre}

.boxmodel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin:14px 0;display:flex;justify-content:center}
.bm-margin{background:repeating-linear-gradient(45deg,#fbe9d5,#fbe9d5 8px,#f7dcc0 8px,#f7dcc0 16px);padding:26px;border-radius:10px;position:relative;text-align:center}
.bm-border{border:5px solid var(--green);border-radius:10px}
.bm-padding{background:#e3efd8;padding:26px;position:relative}
.bm-content{background:#fff;border:1px dashed #9aa58b;padding:14px 24px;font-weight:700}
.bm-l{position:absolute;top:4px;left:10px;font-size:12px;font-family:'JetBrains Mono',monospace;font-weight:600}

.checks label{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:7px 0;cursor:pointer}
.checks input{width:19px;height:19px;margin-top:3px;accent-color:var(--green)}
.bugs details{background:#fff;border:1px solid var(--line);border-radius:10px;margin:8px 0;padding:10px 14px}
.bugs summary{cursor:pointer;font-weight:500}
.bugs p{margin:8px 0 2px}

.gh{counter-reset:g}
.gh-step{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px 14px 62px;margin:12px 0;position:relative}
.gh-step::before{counter-increment:g;content:counter(g);position:absolute;left:16px;top:14px;width:32px;height:32px;border-radius:50%;background:#24292f;color:#fff;display:grid;place-items:center;font-weight:700}
.gh-step h4{margin:2px 0 6px;font-size:18px}
.gh-step p{margin:6px 0}
.ghb{display:inline-block;font-family:-apple-system,'Segoe UI',sans-serif;font-size:13px;font-weight:600;padding:3px 11px;border-radius:6px;border:1px solid rgba(31,35,40,.15);background:#f6f8fa;color:#24292f;white-space:nowrap}
.ghb.green{background:#1f883d;color:#fff;border-color:rgba(31,35,40,.15)}
.urlbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#eef5e6;border:2px solid var(--green2);border-radius:12px;padding:10px 14px;margin:8px 0;font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:600}
.urlbox span{flex:1;word-break:break-all}
.msg{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 18px;white-space:pre-wrap;font-size:16px}

/* fullscreen preview */
.overlay{position:fixed;inset:0;background:rgba(20,28,18,.75);z-index:50;display:none;padding:24px}
.overlay.on{display:flex;flex-direction:column}
.overlay .ovbar{display:flex;justify-content:flex-end;margin-bottom:10px}
.overlay iframe{flex:1;border:0;border-radius:12px;background:#fff;width:100%}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--deep);color:#fff;padding:10px 20px;border-radius:24px;font-size:15px;transition:transform .3s;z-index:60}
.toast.on{transform:translateX(-50%) translateY(0)}

@media (max-width:860px){
  .wrap{grid-template-columns:1fr}
  nav{position:fixed;top:58px;left:0;width:290px;z-index:30;transform:translateX(-100%);transition:transform .25s;box-shadow:4px 0 20px rgba(0,0,0,.15)}
  nav.open{transform:none}
  .menu-btn{display:block}
  main.content{padding:24px 18px 70px}
  h1.st{font-size:30px}
  .duo{grid-template-columns:1fr}
  .prog span{display:none}
  .brand span{display:none}
}

/* ---------- workshop additions ---------- */
main.content{max-width:1240px}
.prose{max-width:860px}
.bench{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin:18px 0 10px}
@media (max-width:1180px){.bench{grid-template-columns:1fr}}
.ed{background:#1f2a1c;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 4px 18px rgba(0,0,0,.08)}
.edtabs{display:flex;align-items:center;gap:6px;padding:8px 10px;background:#2a3826}
.edtab{border:0;border-radius:8px;padding:6px 12px;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;cursor:pointer;background:#3a4934;color:#cfd8c3}
.edtab.on.html{background:var(--html);color:#fff}.edtab.on.css{background:var(--css);color:#fff}
.edhint{margin-left:auto;font-size:12px;color:#9fae93}
.ed textarea{flex:1;min-height:470px;resize:vertical;border:0;outline:0;background:#1f2a1c;color:#eef3e6;font-family:'JetBrains Mono',monospace;font-size:14.5px;line-height:1.6;padding:14px 16px;tab-size:4;white-space:pre;overflow:auto}
.ed textarea::placeholder{color:#6f7d66}
.bench .pv{margin:0;display:flex;flex-direction:column}
.bench .pvframe{flex:1;min-height:470px;height:auto}
.pvtoggle{display:flex;background:#e2e2d6;border-radius:8px;padding:2px}
.pvtoggle button{border:0;background:none;border-radius:6px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer;color:var(--muted)}
.pvtoggle button.on{background:#fff;color:var(--ink);font-weight:600}
.checkbar{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 6px}
.btn.check{background:var(--deep);color:#fff}
.res{margin:12px 0 4px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.res.ok{border:2px solid #5aa04a;background:#f1f9ec}
.res h5{margin:0 0 8px;font-size:17px}
.res ul{list-style:none;padding:0;margin:0}
.res li{padding:6px 0;border-top:1px dashed #e4e6da;font-size:15px;line-height:1.45}
.res li:first-child{border-top:0}
.res li .hint{display:block;color:#8a4a2c;font-size:14px;margin-top:2px}
.res li code{white-space:normal}
.res .more{margin-top:8px;font-size:14px;color:var(--muted)}
.hintwrap{border:2px dashed #cdd3bf;border-radius:16px;padding:6px 16px 4px;margin:14px 0}
.hintwrap h5{margin:10px 0 4px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.cbtn.danger{background:#a24a2a}
.dlbox{background:#fff;border:2px solid var(--green);border-radius:16px;padding:20px;margin:16px 0;text-align:center}
.dlbtn{font-size:19px;padding:15px 30px}
.dlstat{margin-top:10px;font-size:15px;color:var(--muted);min-height:22px}
.resetbtn{margin:22px 10px 0;border:1px solid #cdd3bf;background:none;border-radius:9px;padding:7px 10px;font:inherit;font-size:13px;color:var(--muted);cursor:pointer;width:calc(100% - 20px)}
.resetbtn.arm{background:#a24a2a;color:#fff;border-color:#a24a2a}
.yay{font-size:40px;line-height:1}
</style>
</head>
<body>
<header class="top">
  <button class="menu-btn" id="menuBtn" aria-label="Меню">☰ Кроки</button>
  <div class="brand"><img src="img/logo.png" alt=""><span>Книжковий Рай · майстерня</span></div>
  <div class="prog"><div class="bar"><i id="barFill"></i></div><span id="progTxt"></span></div>
</header>
<div class="wrap">
  <nav id="nav"></nav>
  <main class="content" id="content"></main>
</div>
<div class="overlay" id="overlay"><div class="ovbar"><button class="btn ghost" id="ovClose">✕ Закрити</button></div><iframe id="ovFrame" sandbox="allow-same-origin" title="Сайт на весь екран"></iframe></div>
<div class="toast" id="toast"></div>

<script>
const STEPS = [{"id": "start", "part": "Старт", "title": "Що ми будуємо", "html": 5, "css": 5, "links": true, "widget": "final", "body": "\n<p class=\"lead\">Привіт! 👋 За кілька уроків ти <b>сама<\/b> зробиш справжній сайт для книжкової бібліотеки «Книжковий Рай» — і він буде в інтернеті, з посиланням, яке можна надіслати вчительці.<\/p>\n<p>Праворуч (або нижче) — як сайт виглядатиме в кінці. Його можна погортати.<\/p>\n<h3>Сайт складається з двох мов<\/h3>\n<div class=\"duo\">\n  <div class=\"duo-card html-c\"><div class=\"duo-ico\">🧱<\/div><b>HTML<\/b><span>— це <b>що<\/b> є на сторінці: заголовки, картинки, кнопки, текст. Як цеглинки й меблі в кімнаті.<\/span><code>index.html<\/code><\/div>\n  <div class=\"duo-card css-c\"><div class=\"duo-ico\">🎨<\/div><b>CSS<\/b><span>— це <b>як<\/b> воно виглядає: кольори, шрифти, розміри, відступи. Як фарба й декор у тій кімнаті.<\/span><code>style.css<\/code><\/div>\n<\/div>\n<p>Браузер (Chrome, Edge, Opera) читає обидва файли й малює з них сторінку. Ми спочатку збудуємо «кімнату» (HTML), а потім пофарбуємо (CSS).<\/p>\n<h3>Як працювати в майстерні<\/h3>\n<p>Нічого встановлювати не треба — <b>код пишеш прямо тут<\/b>, у чорному віконці. Поруч одразу видно, що виходить.<\/p>\n<ol class=\"nice\">\n<li>Читай пояснення кроку.<\/li>\n<li>Прочитай <b>завдання<\/b> і напиши код у віконці.<\/li>\n<li>Натисни <b>«Перевірити»<\/b> — майстерня скаже, що вийшло, а що ще ні, і підкаже, де шукати помилку.<\/li>\n<li>Застрягла? Є кнопка «Підказка: правильний код».<\/li>\n<li>Усе зберігається само — можна закрити сторінку й продовжити завтра.<\/li>\n<\/ol>\n", "pvsrc": "ref", "preview": "<!DOCTYPE html>\n<html lang=\"uk\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Книжковий Рай<\/title>\n    <link href=\"https://fonts.googleapis.com/css2?family=Lora:wght@700&family=Roboto:wght@400;700&display=swap\" rel=\"stylesheet\">\n    <style>\n/* ===== Уся сторінка ===== */\nbody {\n    margin: 0;\n    font-family: 'Roboto', sans-serif;\n    color: #333;\n    background-color: #eaeaea;\n    font-size: 16px;\n}\n\n/* ===== Секція 1: зелена шапка ===== */\n.section-main {\n    background-color: #556b2f;\n    padding-top: 40px;\n    padding-bottom: 120px;\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n}\n\n.section-main-logo {\n    width: 160px;\n}\n\n.section-main-title {\n    margin-top: 40px;\n    margin-bottom: 20px;\n    color: #fff;\n    font-family: 'Lora', serif;\n    font-size: 55px;\n    font-weight: 700;\n}\n\n.section-main-subtitle {\n    margin-bottom: 40px;\n    color: #fff;\n    font-size: 22px;\n}\n\n.section-main-button {\n    background-color: #8fbc8f;\n    border: none;\n    border-radius: 25px;\n    color: #fff;\n    font-weight: bold;\n    text-transform: uppercase;\n    padding: 12px 30px;\n    cursor: pointer;\n}\n\n/* ===== Секція 2: про бібліотеку ===== */\n.second-section {\n    display: flex;\n    justify-content: space-evenly;\n    align-items: center;\n    padding-top: 100px;\n    padding-bottom: 100px;\n}\n\n.second-section-img {\n    width: 500px;\n    border: 5px solid #556b2f;\n    border-radius: 20px;\n}\n\n.second-section-info {\n    margin-left: 30px;\n    max-width: 600px;\n}\n\n.section-subtitle {\n    margin-top: 0;\n    margin-bottom: 10px;\n    color: #8fbc8f;\n    font-size: 18px;\n    font-weight: bold;\n    text-transform: uppercase;\n}\n\n.section-title {\n    margin-top: 0;\n    margin-bottom: 40px;\n    color: #556b2f;\n    font-size: 32px;\n    font-weight: bold;\n    text-transform: capitalize;\n}\n\n.second-section-text {\n    margin-bottom: 30px;\n    color: #666;\n    font-size: 18px;\n}\n\n.second-section-name {\n    color: #556b2f;\n    text-transform: capitalize;\n}\n\n.second-section-name2 {\n    color: #8fbc8f;\n    font-weight: bold;\n    text-transform: uppercase;\n}\n\n/* ===== Секція 3: книжки ===== */\n.third-section {\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    background-color: #f5f5f5;\n    padding-top: 100px;\n    padding-bottom: 100px;\n}\n\n.third-section-books {\n    display: flex;\n    justify-content: center;\n    align-items: center;\n    margin-top: 50px;\n    flex-wrap: wrap;\n}\n\n.third-section-book {\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    margin: 10px 20px;\n}\n\n.book-img {\n    height: 200px;\n}\n\n.book-title {\n    margin-top: 10px;\n    margin-bottom: 5px;\n    color: #556b2f;\n    font-size: 22px;\n    font-weight: bold;\n}\n\n.book-author {\n    margin-top: 2px;\n    margin-bottom: 2px;\n    color: #666;\n}\n\n.book-price {\n    margin: 0;\n    color: #8fbc8f;\n    font-size: 20px;\n    font-weight: bold;\n}\n\n/* ===== Секція 4: футер ===== */\n.footer {\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    background-color: #2f4f4f;\n    padding-top: 100px;\n    padding-bottom: 100px;\n}\n\n.footer-title {\n    color: #fff;\n}\n\n.footer-text {\n    width: 600px;\n    text-align: center;\n    margin-top: 0;\n    margin-bottom: 20px;\n    color: #8fbc8f;\n    font-size: 20px;\n}\n\n.footer-text-main {\n    color: #fff;\n}\n\n.footer-form {\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n}\n\n.form-title {\n    margin-top: 20px;\n    margin-bottom: 10px;\n    text-align: center;\n    color: #fff;\n    font-weight: bold;\n    text-transform: uppercase;\n}\n\n.form-input {\n    width: 400px;\n    height: 40px;\n    margin-bottom: 10px;\n    padding: 0 10px;\n    background-color: #2f4f4f;\n    color: #fff;\n    border: 1px solid #fff;\n    border-radius: 8px;\n}\n\n.footer-button {\n    margin-top: 30px;\n    padding: 10px 20px;\n    background-color: #8fbc8f;\n    color: #fff;\n    font-weight: bold;\n    border: none;\n    border-radius: 25px;\n    cursor: pointer;\n}\n<\/style>\n<\/head>\n<body>\n    <main class=\"section-main\">\n        <img class=\"section-main-logo\" src=\"img/logo.png\" alt=\"логотип\">\n        <h1 class=\"section-main-title\">Книжковий Рай<\/h1>\n        <h2 class=\"section-main-subtitle\">Відкрий для себе наступну чудову книгу<\/h2>\n        <button class=\"section-main-button\" type=\"button\">Дізнатися більше<\/button>\n    <\/main>\n\n    <section class=\"second-section\">\n        <img class=\"second-section-img\" src=\"img/library.jpeg\" alt=\"зображення бібліотеки\">\n        <div class=\"second-section-info\">\n            <h3 class=\"section-subtitle\">Ласкаво просимо до Книжкового Раю<\/h3>\n            <h3 class=\"section-title\">Про нашу бібліотеку<\/h3>\n            <p class=\"second-section-text\">Ласкаво просимо до нашої бібліотеки, де ви знайдете широкий вибір книг для будь-якого віку та вподобань. Приходьте та насолоджуйтеся читанням у затишній атмосфері<\/p>\n            <p class=\"second-section-name\"><span class=\"second-section-name2\">Іван Іваненко<\/span> — засновник Книжкового Раю<\/p>\n        <\/div>\n    <\/section>\n\n    <section class=\"third-section\">\n        <h3 class=\"section-subtitle\">Рекомендовані книги<\/h3>\n        <h3 class=\"section-title\">Наша колекція<\/h3>\n        <div class=\"third-section-books\">\n            <div class=\"third-section-book\">\n                <img src=\"img/book1.png\" alt=\"книга 1\" class=\"book-img\">\n                <h4 class=\"book-title\">Маленький принц<\/h4>\n                <p class=\"book-author\">Антуан де Сент-Екзюпері<\/p>\n                <p class=\"book-price\">150 грн<\/p>\n            <\/div>\n            <div class=\"third-section-book\">\n                <img src=\"img/book2.png\" alt=\"книга 2\" class=\"book-img\">\n                <h4 class=\"book-title\">Аліса в Країні Чудес<\/h4>\n                <p class=\"book-author\">Льюїс Керрол<\/p>\n                <p class=\"book-price\">180 грн<\/p>\n            <\/div>\n            <div class=\"third-section-book\">\n                <img src=\"img/book3.png\" alt=\"книга 3\" class=\"book-img\">\n                <h4 class=\"book-title\">Тіні забутих предків<\/h4>\n                <p class=\"book-author\">Михайло Коцюбинський<\/p>\n                <p class=\"book-price\">120 грн<\/p>\n            <\/div>\n            <div class=\"third-section-book\">\n                <img src=\"img/book4.png\" alt=\"книга 4\" class=\"book-img\">\n                <h4 class=\"book-title\">Пригоди Тома Сойєра<\/h4>\n                <p class=\"book-author\">Марк Твен<\/p>\n                <p class=\"book-price\">160 грн<\/p>\n            <\/div>\n        <\/div>\n    <\/section>\n\n    <footer class=\"footer\">\n        <h3 class=\"section-subtitle\">Книжковий Рай<\/h3>\n        <h3 class=\"section-title footer-title\">Приєднуйтесь до нашої спільноти<\/h3>\n        <p class=\"footer-text\"><span class=\"footer-text-main\">Підпишіться на нашу розсилку, щоб отримувати останні новини про новинки, ексклюзивні пропозиції та багато іншого.<\/span><br>Для запитів, будь ласка, зв'яжіться з нами за номером (+380) 123-456-789<\/p>\n        <form action=\"\" class=\"footer-form\">\n            <p class=\"form-title\">Ім'я<\/p>\n            <input type=\"text\" id=\"name\" class=\"form-input\">\n            <p class=\"form-title\">Електронна пошта<\/p>\n            <input type=\"email\" id=\"email\" class=\"form-input\">\n            <p class=\"form-title\">Телефон<\/p>\n            <input type=\"tel\" id=\"phone\" class=\"form-input\">\n            <button class=\"footer-button\">Підписатися<\/button>\n        <\/form>\n    <\/footer>\n<\/body>\n<\/html>\n"}, {"id": "setup", "part": "Старт", "title": "Як влаштований сайт", "html": null, "css": null, "widget": "gallery", "body": "\n<p>Будь-який сайт — це просто <b>файли в папці<\/b>. Наш складатиметься з таких:<\/p>\n<pre class=\"tree\">📁 Book heaven\n ├── 📁 img          ← картинки\n ├── 📄 index.html   ← розмітка (HTML)\n └── 📄 style.css    ← стилі (CSS)<\/pre>\n<p>У майстерні над віконцем для коду є дві вкладки — <code>index.html<\/code> і <code>style.css<\/code>. Це і є твої два файли. Перемикайся між ними, коли треба.<\/p>\n<p class=\"note\">💡 Назва <code>index.html<\/code> — особлива: саме цей файл браузер відкриває першим, коли заходиш на сайт. Тому головна сторінка завжди так називається.<\/p>\n<h3>Картинки вже на місці<\/h3>\n<p>Ось картинки з папки <code>img<\/code>. Качати нічого не треба — у коді просто пишеш шлях, наприклад <code>img/logo.png<\/code>.<\/p>\n"}, {"id": "skeleton", "part": "HTML", "title": "Скелет сторінки", "html": 0, "css": 0, "links": false, "body": "\n<p>Кожна HTML-сторінка починається однаково — зі «скелета». Це як обкладинка й форзац у книжці: читач їх майже не помічає, але без них книжка розсиплеться.<\/p>\n<h3>Що таке тег<\/h3>\n<p>HTML складається з <b>тегів<\/b> — слів у кутових дужках. Більшість тегів ходять парами: відкривальний і закривальний (з похилою рискою):<\/p>\n<pre class=\"mini\"><span class=\"t\">&lt;title&gt;<\/span>Книжковий Рай<span class=\"t\">&lt;/title&gt;<\/span><\/pre>\n<p>Теги вкладаються один в одний, як матрьошки. Тому ми робимо відступи — щоб було видно, що всередині чого.<\/p>\n<ul class=\"nice\">\n<li><code>&lt;head&gt;<\/code> — «голова»: службова інформація, якої на сторінці не видно (назва вкладки, мова, кодування).<\/li>\n<li><code>&lt;body&gt;<\/code> — «тіло»: усе, що бачить відвідувач.<\/li>\n<\/ul>\n", "task": ["У віконці відкрита вкладка <code>index.html<\/code> — пиши там.", "Напиши стандартну структуру <code>&lt;html&gt;<\/code>, <code>&lt;head&gt;<\/code>, <code>&lt;body&gt;<\/code>.", "У тезі <code>&lt;title&gt;<\/code> назви сайт «Книжковий Рай»."], "code": [{"file": "index.html", "lang": "html", "where": "Весь файл index.html", "snippet": "<!DOCTYPE html>\n<html lang=\"uk\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Книжковий Рай<\/title>\n<\/head>\n<body>\n\n<\/body>\n<\/html>"}], "after": "<p>Сторінка поки біла — це нормально! Але подивись на <b>верхню смужку<\/b> прев’ю: там з’явилося «Книжковий Рай». У справжньому браузері так виглядатиме назва вкладки — це працює <code>&lt;title&gt;<\/code>. 🎉<\/p>", "words": [["&lt;!DOCTYPE html&gt;", "каже браузеру: «це сучасний HTML»"], ["lang=\"uk\"", "мова сторінки — українська"], ["charset=\"UTF-8\"", "щоб українські літери не стали «кракозябрами»"], ["viewport", "щоб сайт нормально виглядав на телефоні"]], "quiz": {"q": "Куди треба писати те, що відвідувач бачитиме на сторінці?", "options": ["У &lt;head&gt;", "У &lt;body&gt;", "У &lt;title&gt;"], "correct": 1, "explain": "Усе видиме живе в &lt;body&gt;. А &lt;head&gt; — службова «голова»."}, "preview": "<!DOCTYPE html>\n<html lang=\"uk\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Книжковий Рай<\/title>\n<\/head>\n<body>\n\n<\/body>\n<\/html>\n", "full": [{"file": "index.html", "lang": "html", "text": "<!DOCTYPE html>\n<html lang=\"uk\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Книжковий Рай<\/title>\n<\/head>\n<body>\n\n<\/body>\n<\/html>\n"}]}, {"id": "blocks", "part": "HTML", "title": "Чотири великі блоки", "html": 1, "css": 0, "links": false, "body": "\n<p>Подивись на макет: сайт складається з <b>чотирьох смуг<\/b> одна під одною. Для кожної зробимо свій блок-«коробку»:<\/p>\n<div class=\"bands\">\n  <div style=\"background:#556b2f;color:#fff\">main — зелена шапка з логотипом<\/div>\n  <div style=\"background:#eaeaea\">section — про бібліотеку<\/div>\n  <div style=\"background:#f5f5f5\">section — книжки<\/div>\n  <div style=\"background:#2f4f4f;color:#fff\">footer — підписка й контакти<\/div>\n<\/div>\n<h3>Що таке class<\/h3>\n<p><code>class<\/code> — це <b>наліпка з іменем<\/b> на коробці. HTML вона не змінює, але потім у CSS ми скажемо: «коробку з наліпкою <code>section-main<\/cod hird-section\">\n\n    <\/section>\n\n    <footer class=\"footer\">\n\n    <\/footer>\n<\/body>\n<\/html>\n"}]}, {"id": "html-main", "part": "HTML", "title": "Шапка: логотип і заголовок", "html": 2, "css": 0, "links": false, "body": "\n<p>Наповнюємо першу коробку <code>main<\/code>. У ній 4 речі: логотип, великий заголовок, підзаголовок і кнопка.<\/p>\n<h3>Картинка: тег &lt;img&gt;<\/h3>\n<p><code>&lt;img&gt;<\/code> — тег <b>без пари<\/b> (закривати не треба). Йому потрібні атрибути:<\/p>\n<ul class=\"nice\">\n<li><code>src=\"img/logo.png\"<\/code> — <b>де лежить<\/b> картинка: у папці <code>img<\/code>, файл <code>logo.png<\/code>.<\/li>\n<li><code>alt=\"логотип\"<\/code> — <b>опис словами<\/b>. Його покаже браузер, якщо картинка не завантажиться, і прочитає програма для незрячих людей.<\/li>\n<\/ul>\n<p class=\"warn\">⚠️ У підручнику написано просто <code>src=\"logo.png\"<\/code>. Але ми поклали картинки в папку <b>img<\/b>, тому шлях — <code>img/logo.png<\/code>. Інакше браузер картинку не знайде.<\/p>\n<h3>Заголовки h1…h6<\/h3>\n<p><code>&lt;h1&gt;<\/code> — найголовніший і найбільший заголовок (на сторінці один!), <code>&lt;h2&gt;<\/code> — трохи менший, і так до <code>&lt;h6&gt;<\/code>.<\/p>\n", "task": ["Усередині <code>main<\/code> додай картинку-логотип <code>img/logo.png<\/code>.", "Заголовок <code>h1<\/code>: «Книжковий Рай».", "Підзаголовок <code>h2<\/code>: «Відкрий для себе наступну чудову книгу».", "Кнопку <code>button<\/code>: «Дізнатися більше».", "Класи: <code>section-main-logo<\/code>, <code>section-main-title<\/code>, <code>section-main-subtitle<\/code>, <code>section-main-button<\/code>."], "code": [{"file": "index.html", "lang": "html", "where": "Заміни порожній блок main на цей", "snippet": "    <main class=\"section-main\">\n        <img class=\"section-main-logo\" src=\"img/logo.png\" alt=\"логотип\">\n        <h1 class=\"section-main-title\">Книжковий Рай<\/h1>\n        <h2 class=\"section-main-subtitle\">Відкрий для себе наступну чудову function armButton(btn, label, fn){ // two-click confirm without browser dialogs

/* ---------- syntax highlight (for hint code) ---------- */
function hlHTML(src){
  let out=''; const re=/(<!--[\s\S]*?-->)|(<\/?[a-zA-Z!][^>]*>)/g; let last=0, m;
  const e=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  while((m=re.exec(src))){
    out+=e(src.slice(last,m.index));
    if(m[1]) out+='<span class="hl-com">'+e(m[1])+'</span>';
    else{
      const mm=m[2].match(/^<(\/?)([a-zA-Z!][\w-]*)([\s\S]*?)(\/?)>$/);
      if(!mm) out+=e(m[2]);
      else{
        let attrs=e(mm[3]).replace(/([\w-]+)(=)"([^"]*?)"/g,'<span class="hl-attr">$1</span>$2<span class="hl-str">"$3"</span>')
                          .replace(/(^|\s)([\w-]+)(?=\s|$)/g,'$1<span class="hl-attr">$2</span>');
        out+='<span class="hl-tag">&lt;'+mm[1]+mm[2]+'</span>'+attrs+'<span class="hl-tag">'+mm[4]+'&gt;</span>';
      }
    }
    last=re.lastIndex;
  }
  return out+e(src.slice(last));
}
function hlCSS(src){
  const e=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return src.split('\n').map(line=>{
    if(/^\s*\/\*.*\*\/\s*$/.test(line)) return '<span class="hl-com">'+e(line)+'</span>';
    let m=line.match(/^(\s*)([^{]+?)(\s*\{)\s*$/);
    if(m) return m[1]+'<span class="hl-sel">'+e(m[2])+'</span><span class="hl-punc">'+m[3]+'</span>';
    m=line.match(/^(\s*)([\w-]+)(\s*:\s*)(.*?)(;?)\s*$/);
    if(m) return m[1]+'<span class="hl-prop">'+m[2]+'</span><span class="hl-punc">'+m[3]+'</span><span class="hl-val">'+e(m[4])+'</span><span class="hl-punc">'+m[5]+'</span>';
    return '<span class="hl-punc">'+e(line)+'</span>';
  }).join('\n');
}

/* css spec: {selector: "prop:val|alt=label; ..."} */
function cssChecks(spec){
  const items=[];
  Object.entries(spec).forEach(([sel,decls])=>{
    decls.split(';').map(x=>x.trim()).filter(Boolean).forEach(d=>{
      let [pv,label]=d.split('='); const i=pv.indexOf(':'); const prop=pv.slice(0,i).trim(); const val=pv.slice(i+1).trim();
      label = label ? label.trim() : `${prop}: ${val.split('|')[0].replace('~','')}`;
      let it=items.find(x=>x.sel===sel && x.label===label);
      if(!it){ it={sel,label,req:[]}; items.push(it); }
      it.req.push([prop,val]);
    });
  });
  return items.map(it=>({css:true, t:`<code>${it.sel}</code> → <code>${esc(it.label)}</code>`, f:(ctx)=>{
    if(!ctx.map[it.sel]) return {ok:false, h:`Не знайшла правило <code>${it.sel} { … }</code>. Перевір крапку перед назвою класу, фігурні дужки й чи назва збігається з HTML.`};
    for(const [prop,val] of it.req){
      const got=getProp(ctx.map,it.sel,prop);
      const ok = val.split('|').some(v=> v.startsWith('~') ? normVal(prop,got).includes(v.slice(1).toLowerCase()) : normVal(prop,got)===normVal(prop,serialize(prop,v)));
      if(!ok) return {ok:false, h: got ? `Зараз тут «${esc(got)}». Перевір значення й одиниці (px).` : `Не бачу цієї властивості в правилі. Можливо, забута <code>;</code> у цьому чи сусідньому рядку, або описка в назві.`};
    }
    return {ok:true};
  }}));
}

function H(t, f, h){ return {t, f:(ctx)=>({ok:!!f(ctx.doc, ctx.raw), h}) }; }
function srcCheck(sel, file){ return {t:`Картинка <code>${sel}</code> з <code>src="img/${file}"</code>`, f:({doc})=>{
  const el=q(doc,sel); if(!el) return {ok:false,h:`Не знайшла тег <code>&lt;img&gt;</code> з потрібним класом. Перевір <code>class="…"</code>.`};

function runChecks(id){
  const list=CHECKS[id]||[]; const ctx={raw:code.html, doc:parseDoc(code.html), map:cssMap(code.css)};
  return list.map(c=>{ let r; try{ r=c.f(ctx); }catch(e){ r={ok:false,h:'Не вдалося перевірити — подивись на код уважно.'}; } return {t:c.t, ok:r.ok, h:r.h}; });
}

/* ---------- nav ---------- */
function renderNav(){
  let h='', part='';
  STEPS.forEach((s,i)=>{
    if(s.part!==part){ part=s.part; h+=`<h4>${part}</h4>`; }
    h+=`<button class="${i===cur?'on':''} ${done[s.id]?'done':''}" data-i="${i}"><span class="dot">${done[s.id]?'✓':i+1}</span>${s.title}</button>`;
  });
  h+=`<button class="resetbtn" id="resetBtn">↺ Почати все спочатку</button>`;
  $('#nav').innerHTML=h;
  $('#nav').querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>{ go(+b.dataset.i); $('#nav').classList.remove('open'); });
  armButton($('#resetBtn'),'Точно стерти весь код?',()=>{ code={html:'',css:''}; done={}; checks={}; store.set('html','');store.set('css','');store.set('done',{});store.set('checks',{}); go(0); toast('Почнімо спочатку!'); });
  const n=STEPS.filter(s=>done[s.id]).length;
  $('#barFill').style.width=(n/STEPS.length*100)+'%';
  $('#progTxt').textContent=`Зроблено ${n} з ${STEPS.length}`;
}

    <div class="bugs">
      <details><summary>Пише «404 — There isn’t a GitHub Pages site here»</summary><p>Зачекай ще кілька хвилин. Перевір, що файл називається точно <code>index.html</code> (маленькими літерами) і лежить на верхньому рівні репозиторію, а не в іншій папці.</p></details>
      <details><summary>У майстерні картинки є, а на сайті — ні</summary><p>Перевір, що папка <code>img</code> завантажилась разом з картинками. GitHub розрізняє великі й малі літери: <code>Logo.PNG</code> і <code>logo.png</code> для нього — різні файли.</p></details>
      <details><summary>Як виправити щось після публікації?</summary><p>Виправ у майстерні, скачай архів ще раз, розпакуй і знову завантаж файли через <span class="ghb">Add file</span> → <span class="ghb">Upload files</span> → <span class="ghb green">Commit changes</span>.</p></details>
    </div>`;
  case 'finish': {
    const msg=`Добрий день! Надсилаю свій проєкт «Книжковий Рай» (теми 18–19).\nСайт: ${SITE_URL}\nДякую!`;
    return `<h3>Повідомлення вчительці</h3><p>Скопіюй і встав у месенджер або листа (впиши своє ім’я, якщо треба):</p>
      <div class="msg">${esc(msg)}</div><p><button class="cbtn" style="background:var(--green);padding:9px 16px" data-copy="${esc(msg)}">Скопіювати повідомлення</button></p>
      <p class="note">💡 Якщо вчителька попросить ще й файли — надішли їй архів <code>book-heaven.zip</code>.</p>
      <h3>Хочеш більше? Ідеї для сміливих</h3>
      <ul class="nice"><li>Додай п’яту книжку — полиця сама перенесе її на новий рядок.</li><li>Зроби, щоб кнопка змінювала колір при наведенні: <code>.footer-button:hover { background-color: #556b2f; }</code></li><li>Зміни кольори сайту на свої улюблені.</li></ul>`;
  }
  default: return '';
  }
}
function bindWidget(s){
  if(s.widget==='flex'){
    const box=$('#fbox'), cd=$('#fcode');
    const show=()=>{ cd.textContent=`.section-main {\n    display: flex;\n    flex-direction: ${box.style.flexDirection};\n    align-items: ${box.style.alignItems};\n    justify-content: ${box.style.justifyContent};\n}`; };
    document.querySelectorAll('.seg').forEach(seg=>seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      seg.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); box.style[seg.dataset.p]=b.dataset.v; show();
    }));
    show();
  }
  if(s.widget==='download') $('#dlBtn').onclick=downloadZip;
  document.querySelectorAll('.checks input').forEach(c=>c.onchange=()=>{ checks[c.dataset.k]=c.checked; store.set('checks',checks); });
}

/* ---------- download ---------- */
async function downloadZip(){
  const st=$('#dlStat');
  if(!code.html.trim()){ st.innerHTML='⚠️ У майстерні ще немає твого коду. Спершу пройди кроки HTML і CSS.'; return; }
  st.textContent='Пакую файли…';
  try{
    if(typeof JSZip==='undefined') throw new Error('nozip');
    const zip=new JSZip(); zip.file('index.html',code.html); zip.file('style.css',code.css);
    for(const f of IMGS){ const r=await fetch('img/'+f); if(!r.ok) throw new Error('img'); zip.file('img/'+f, await r.blob()); }
    const blob=await zip.generateAsync({type:'blob'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='book-heaven.zip'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    st.innerHTML='✅ Готово! Шукай <b>book-heaven.zip</b> у папці «Завантаження».';
    done['download']=true; store.set('done',done); renderNav();
  }catch(e){
    st.innerHTML=`Тут скачування не працює. Відкрий майстерню за адресою <a href="${WORKSHOP_URL}#s-download" target="_blank" rel="noopener">${WORKSHOP_URL}</a> у тому ж браузері — і натисни кнопку там.`;
  }
}

/* ---------- preview ---------- */
const PV_W=1240;
function fitPreview(){
  document.querySelectorAll('.pvframe').forEach(f=>{
    const ifr=f.querySelector('iframe'); const sc=Math.min(1,f.clientWidth/PV_W);
    ifr.style.width=PV_W+'px'; ifr.style.height=(f.clientHeight/sc)+'px'; ifr.style.transform=`scale(${sc})`;
  });
}
function setFrame(ifr, html){
  let y=0; try{ y=ifr.contentWindow.scrollY||0; }catch(e){}
  ifr.onload=()=>{ try{ ifr.contentWindow.scrollTo(0,y); }catch(e){} };
  ifr.srcdoc=html;
}
let pvTimer;
function refreshPreview(now){
  clearTimeout(pvTimer);
  pvTimer=setTimeout(()=>{
    const s=STEPS[cur], ifr=$('#pvIframe'); if(!ifr) return;
    const mine = pvMode==='mine' && s.pvsrc!=='ref';
    setFrame(ifr, mine ? myDoc() : s.preview);
    const t=$('#pvTitle'); if(t) t.textContent = mine ? ('📄 ' + (myTitle()||'без назви')) : '📄 Книжковий Рай — зразок';
  }, now?0:350);
}

/* ---------- editor ---------- */
function bindEditor(){
  const ta=$('#ed'); if(!ta) return;
  const load=()=>{ ta.value=code[curFile]; ta.placeholder = curFile==='html' ? 'Пиши тут HTML…' : 'Пиши тут CSS…';
    document.querySelectorAll('.edtab').forEach(b=>b.classList.toggle('on', b.dataset.f===curFile)); };
  document.querySelectorAll('.edtab').forEach(b=>b.onclick=()=>{ curFile=b.dataset.f; load(); ta.focus(); });
  ta.oninput=()=>{ code[curFile]=ta.value; store.set(curFile,ta.value); refreshPreview(); };
  ta.onkeydown=e=>{
    if(e.key==='Tab'){ e.preventDefault(); ta.setRangeText('    ',ta.selectionStart,ta.selectionEnd,'end'); ta.dispatchEvent(new Event('input')); }
    else if(e.key==='Enter' && !e.shiftKey && !e.ctrlKey){
      const v=ta.value, p=ta.selectionStart, ls=v.lastIndexOf('\n',p-1)+1, ind=(v.slice(ls,p).match(/^\s*/)||[''])[0];
      e.preventDefault(); ta.setRangeText('\n'+ind,p,ta.selectionEnd,'end'); ta.dispatchEvent(new Event('input'));
    }
  };
  load();
}

/* ---------- step render ---------- */
function go(i){
  cur=Math.max(0,Math.min(STEPS.length-1,i));
  const s=STEPS[cur];
  try{ history.replaceState(null,'','#s-'+s.id); }catch(e){}
  curFile = (s.part==='CSS' && s.id!=='css-body') ? 'css' : 'html';
  pvMode='mine';
  let h=`<div class="prose"><span class="chip ${s.part}">${s.part}</span><span class="stepno">Крок ${cur+1} з ${STEPS.length}</span><h1 class="st">${s.title}</h1>${s.body}`;
  if(s.widget) h+=widget(s);
  if(s.task) h+=`<div class="task"><h5>✏️ Завдання</h5><ol>${s.task.map(t=>`<li>${t}</li>`).join('')}</ol><p class="tip-type">${s.code[0].where} — пиши у віконці нижче. Прев’ю праворуч оновлюється саме.</p></div>`;
  h+=`</div>`;
  const pvHead=(toggle)=>`<div class="pvhead"><div class="dots"><i></i><i></i><i></i></div><div class="pvurl" id="pvTitle"></div>${toggle?`<div class="pvtoggle"><button data-m="mine" class="on">Мій сайт</button><button data-m="ref">Як має бути</button></div>`:''}<button class="cbtn" id="fullBtn" style="background:#dcdccf;color:#24301c">⛶</button></div>`;
  if(s.task){
    h+=`<div class="bench"><div class="ed"><div class="edtabs"><button class="edtab html" data-f="html">index.html</button><button class="edtab css" data-f="css">style.css</button><span class="edhint">Tab — відступ</span></div><textarea id="ed" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea></div>
      <div class="pv">${pvHead(true)}<div class="pvframe"><iframe sandbox="allow-same-origin" title="Прев’ю" id="pvIframe"></iframe></div></div></div>
      <div class="checkbar"><button class="btn check" id="checkBtn">✔ Перевірити</button><button class="btn ghost" id="hintBtn">💡 Підказка: правильний код</button></div>
      <div id="checkRes"></div><div id="hintArea" hidden></div>`;
  } else if(s.preview){
    const cap = s.pvsrc==='ref' ? 'Так виглядатиме готовий сайт. Погортай його!' : 'Це твій сайт з майстерні';
    h+=`<div class="pv prose">${pvHead(false)}<div class="pvframe"><iframe sandbox="allow-same-origin" title="Прев’ю" id="pvIframe"></iframe></div><div class="pvcap">${cap}</div></div>`;
  }
  h+=`<div class="prose">`;
  if(s.after) h+=s.after;
  if(s.words) h+=`<h3>📘 Нові слова</h3><div class="words">${s.words.map(([w,d])=>`<div class="word"><b>${w}</b>${d}</div>`).join('')}</div>`;
  if(s.quiz) h+=`<div class="quiz"><h5>🧠 Перевір себе</h5><p class="q">${s.quiz.q}</p>${s.quiz.options.map((o,oi)=>`<button class="qopt" data-oi="${oi}">${o}</button>`).join('')}<div class="qres" id="qres"></div></div>`;
  const last=cur===STEPS.length-1;
  h+=`<div class="stepnav"><button class="btn ghost" id="prevBtn" ${cur===0?'disabled':''}>← Назад</button><button class="btn go" id="nextBtn">${last?'🏆 Готово!':(s.task?'Далі →':'Зроблено ✓ Далі →')}</button></div></div>`;
  $('#content').innerHTML=h;

  bindEditor();
  if($('#pvIframe')){ fitPreview(); refreshPreview(true); }
  document.querySelectorAll('.pvtoggle button').forEach(b=>b.onclick=()=>{ pvMode=b.dataset.m; document.querySelectorAll('.pvtoggle button').forEach(x=>x.classList.toggle('on',x===b)); refreshPreview(true); });
  const fb=$('#fullBtn'); if(fb) fb.onclick=()=>{ const mine=pvMode==='mine' && s.pvsrc!=='ref'; $('#ovFrame').srcdoc= mine?myDoc():s.preview; $('#overlay').classList.add('on'); };
  const cb=$('#checkBtn'); if(cb) cb.onclick=()=>doCheck(s);
  const hb=$('#hintBtn'); if(hb) hb.onclick=()=>showHint(s);
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyText(b.dataset.copy));
  document.querySelectorAll('.qopt').forEach(b=>b.onclick=()=>{
    const ok=+b.dataset.oi===s.quiz.correct;
    document.querySelectorAll('.qopt').forEach(x=>x.classList.remove('right','wrong'));
    b.classList.add(ok?'right':'wrong');
    $('#qres').innerHTML= ok ? '✅ '+s.quiz.explain : '🤔 Не зовсім. Спробуй ще раз!';
  });
  bindWidget(s);
  $('#prevBtn').onclick=()=>go(cur-1);
  $('#nextBtn').onclick=()=>{
    if(!s.task){ done[s.id]=true; store.set('done',done); }
    if(last){ renderNav(); toast('🏆 Молодець!'); } else go(cur+1);
  };
  renderNav();
  window.scrollTo({top:0});
  store.set('cur',cur);
}

function doCheck(s){
  const res=runChecks(s.id); const bad=res.filter(r=>!r.ok); const box=$('#checkRes');
  if(!bad.length){
    done[s.id]=true; store.set('done',done); renderNav();
    box.innerHTML=`<div class="res ok"><h5><span class="yay">🎉</span> Усе правильно! (${res.length} з ${res.length})</h5><p style="margin:4px 0 0">Супер! Тисни «Далі →».</p></div>`;
  } else {
    const okN=res.length-bad.length; const show=bad.slice(0,6);
    box.innerHTML=`<div class="res"><h5>Майже! Правильно ${okN} з ${res.length}. Ось що ще треба виправити:</h5><ul>${show.map(r=>`<li>❌ ${r.t}${r.h?`<span class="hint">${r.h}</span>`:''}</li>`).join('')}</ul>${bad.length>show.length?`<div class="more">…і ще ${bad.length-show.length}. Виправ ці — і перевір знову.</div>`:''}</div>`;
  }
  box.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function showHint(s){
  const a=$('#hintArea'); a.hidden=!a.hidden; if(a.hidden) return;
  let h=`<div class="hintwrap"><h5>Що треба було написати на цьому кроці</h5>`;
  s.code.forEach((c,ci)=>{ h+=`<div class="codebox"><div class="codehead"><span class="fname ${c.lang}">${c.file}</span><span class="where">${c.where}</span><button class="cbtn" data-ci="${ci}">Копіювати</button></div><pre class="code">${hl(c.lang,c.snippet)}</pre></div>`; });
  h+=`<p style="font-size:15px;color:var(--muted)">Зовсім заплуталась? Можна замінити свій код на правильний для цього кроку і йти далі. Але спершу спробуй знайти помилку сама 😉</p>
      <p><button class="cbtn danger" id="replaceBtn">Замінити мій код на правильний</button></p></div>`;
  a.innerHTML=h;
  a.querySelectorAll('[data-ci]').forEach(b=>b.onclick=()=>copyText(s.code[+b.dataset.ci].snippet));
  armButton($('#replaceBtn'),'Точно? Твій код на цьому кроці заміниться',()=>{
    s.full.forEach(f=>{ const k=f.file==='index.html'?'html':'css'; code[k]=f.text; store.set(k,f.text); });
    if(!s.full.some(f=>f.file==='style.css') && s.css===0){ /* keep css as is */ }
    $('#ed').value=code[curFile]; refreshPreview(true); toast('Код замінено');
  });
}

$('#ovClose').onclick=()=>$('#overlay').classList.remove('on');
$('#menuBtn').onclick=()=>$('#nav').classList.toggle('open');
window.addEventListener('resize',fitPreview);
function fromHash(){ const id=(location.hash||'').replace('#s-',''); return STEPS.findIndex(s=>s.id===id); }
window.addEventListener('hashchange',()=>{ const i=fromHash(); if(i>=0 && i!==cur) go(i); });
const hi=fromHash(); go(hi>=0? hi : store.get('cur',0));
</script>
</body>
</html>
